<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brandi's Universe</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
body{
margin:0;
background:black;
font-family:Arial;
color:white;
}

.player{
position:fixed;
right:10px;
bottom:10px;
background:#111;
padding:12px;
border-radius:10px;
}

button{
margin:4px;
padding:8px 12px;
border-radius:6px;
border:none;
background:#333;
color:white;
font-weight:bold;
}

button:hover{
background:#555;
}
</style>
</head>

<body>

<div class="player">

<div id="song">Ready</div>

<button onclick="prev()">Prev</button>
<button onclick="play()">Play</button>
<button onclick="next()">Next</button>

<br>

<input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">

</div>

<audio id="audio"></audio>

<a-scene background="color:#000">

<a-assets>

<img id="sky1" src="space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy.jpg">

<img id="sky2" src="space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy (1).jpg">

</a-assets>

<a-sky id="sky" src="#sky1"></a-sky>

<a-entity light="type:ambient;intensity:1"></a-entity>

</a-scene>

<script>

const BASE =
"https://pub-180861afe41148b8acd08af4e87da48b.r2.dev/Music/tree/";

const songs = [

"03 STARSET - Frequency.mp3",
"02 STARSET - MANIFEST.mp3",
"05 STARSET - EARTHRISE.mp3"

];

const audio = document.getElementById("audio");
const songText = document.getElementById("song");
const volume = document.getElementById("volume");

let index = 0;

function url(name){

return BASE + name.replaceAll(" ","%20");

}

function load(n){

index = (n + songs.length) % songs.length;

audio.src = url(songs[index]);

songText.innerText = songs[index];

}

async function play(){

if(!audio.src) load(index);

try{

await audio.play();

}catch(e){

console.log(e);

}

}

function next(){

load(index + 1);

play();

}

function prev(){

load(index - 1);

play();

}

volume.addEventListener("input",()=>{

audio.volume = volume.value;

});

load(0);

/* background swap */

const sky=document.getElementById("sky");

let toggle=true;

setInterval(()=>{

sky.setAttribute("src", toggle ? "#sky2" : "#sky1");

toggle=!toggle;

},45000);

</script>

</body>
</html>
