<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Korndog Cosmic Drift — Planetarium Mode + STARSET VR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .hud {
      position: fixed;
      left: 12px;
      bottom: 10px;
      z-index: 20;
      font: 14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: rgba(255,255,255,.85);
      text-shadow: 0 2px 10px rgba(0,0,0,.75);
      user-select: none;
      pointer-events: none;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(3px);
    }

    .player-ui {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 30;
      width: min(92vw, 360px);
      color: #fff;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .player-title {
      font-size: 13px;
      opacity: .75;
      margin-bottom: 6px;
    }

    .now-playing {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .controls button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 10px 8px;
      font-weight: 700;
      font-size: 14px;
      background: rgba(255,255,255,.12);
      color: #fff;
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      opacity: .92;
    }

    .volume-wrap input[type="range"] {
      flex: 1;
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      opacity: .75;
      min-height: 16px;
    }

    .a-enter-vr-button {
      border-radius: 14px !important;
    }

    audio {
      display: none;
    }
  </style>
</head>

<body>
  <div class="hud">
    Auto background swap • Planetarium swirl • Planets spin • STARSET visualizer mode
  </div>

  <!-- SCREEN CONTROLS -->
  <div class="player-ui">
    <div class="player-title">Brandi’s Universe • STARSET Cloud Player</div>
    <div class="now-playing" id="nowPlaying">Loading playlist...</div>

    <div class="controls">
      <button id="prevBtn">⏮ Prev</button>
      <button id="playPauseBtn">▶ Play</button>
      <button id="nextBtn">Next ⏭</button>
    </div>

    <div class="volume-wrap">
      <span>Vol</span>
      <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.85" />
    </div>

    <div class="status" id="playerStatus">Preparing player...</div>
  </div>

  <audio
    id="audioPlayer"
    preload="metadata"
    playsinline
    webkit-playsinline
  ></audio>

  <a-scene
    vr-mode-ui="enabled: true"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
    background="color: #000"
  >

    <!-- CAMERA RIG -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera
        id="camera"
        wasd-controls-enabled="false"
        look-controls="pointerLockEnabled: false"
        fov="78"
        raycaster="objects: .clickable; far: 2.5"
        cursor="fuse: true; fuseTimeout: 800"
      >
        <a-cursor
          material="color: #ffffff; shader: flat"
          geometry="primitive: ring; radiusInner: 0.010; radiusOuter: 0.016">
        </a-cursor>
      </a-camera>

      <!-- FLOATING VR CONTROL PANEL -->
      <a-entity id="vrPanel" position="0 -0.10 -1.10">
        <a-plane
          width="1.65"
          height="0.88"
          color="#120814"
          opacity="0.84"
          material="transparent: true; shader: flat">
        </a-plane>

        <a-text
          id="vrTitle"
          value="STARSET VR PLAYER"
          position="0 0.30 0.02"
          align="center"
          width="2.2"
          color="#ffffff">
        </a-text>

        <a-text
          id="vrNowPlaying"
          value="Loading songs..."
          position="0 0.16 0.02"
          align="center"
          width="1.6"
          color="#f3f3f3"
          wrap-count="26">
        </a-text>

        <a-text
          id="vrStatus"
          value="Preparing player..."
          position="0 0.03 0.02"
          align="center"
          width="1.45"
          color="#d0d0d0"
          wrap-count="30">
        </a-text>

        <!-- Prev -->
        <a-plane
          id="vrPrevBtn"
          class="clickable"
          position="-0.48 -0.14 0.03"
          width="0.34"
          height="0.14"
          color="#5a2246"
          material="shader: flat">
        </a-plane>
        <a-text
          value="PREV"
          position="-0.48 -0.14 0.04"
          align="center"
          width="1.0"
          color="#ffffff">
        </a-text>

        <!-- Play -->
        <a-plane
          id="vrPlayPauseBtn"
          class="clickable"
          position="0 -0.14 0.03"
          width="0.40"
          height="0.14"
          color="#6e2958"
          material="shader: flat">
        </a-plane>
        <a-text
          id="vrPlayPauseLabel"
          value="PLAY"
          position="0 -0.14 0.04"
          align="center"
          width="1.1"
          color="#ffffff">
        </a-text>

        <!-- Next -->
        <a-plane
          id="vrNextBtn"
          class="clickable"
          position="0.48 -0.14 0.03"
          width="0.34"
          height="0.14"
          color="#5a2246"
          material="shader: flat">
        </a-plane>
        <a-text
          value="NEXT"
          position="0.48 -0.14 0.04"
          align="center"
          width="1.0"
          color="#ffffff">
        </a-text>

        <!-- Volume -->
        <a-text
          value="VOL"
          position="-0.62 -0.33 0.04"
          align="center"
          width="0.7"
          color="#ffffff">
        </a-text>

        <a-plane
          id="vrVolDownBtn"
          class="clickable"
          position="-0.28 -0.33 0.03"
          width="0.20"
          height="0.12"
          color="#3b3b3b"
          material="shader: flat">
        </a-plane>
        <a-text
          value="-"
          position="-0.28 -0.33 0.04"
          align="center"
          width="1.0"
          color="#ffffff">
        </a-text>

        <a-text
          id="vrVolText"
          value="85%"
          position="0 -0.33 0.04"
          align="center"
          width="0.9"
          color="#ffffff">
        </a-text>

        <a-plane
          id="vrVolUpBtn"
          class="clickable"
          position="0.28 -0.33 0.03"
          width="0.20"
          height="0.12"
          color="#3b3b3b"
          material="shader: flat">
        </a-plane>
        <a-text
          value="+"
          position="0.28 -0.33 0.04"
          align="center"
          width="1.0"
          color="#ffffff">
        </a-text>
      </a-entity>
    </a-entity>

    <!-- Beat Saber style sabers -->
    <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .clickable; far: 2.5">
      <a-cylinder
        position="0 0 -0.45"
        radius="0.012"
        height="0.9"
        color="#ff2a6d"
        opacity="0.9"
        material="shader: flat; transparent: true"
        rotation="90 0 0">
      </a-cylinder>
      <a-sphere
        position="0 0 -0.9"
        radius="0.028"
        color="#ff9ac2"
        opacity="0.95"
        material="shader: flat; transparent: true">
      </a-sphere>
    </a-entity>

    <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .clickable; far: 2.5">
      <a-cylinder
        position="0 0 -0.45"
        radius="0.012"
        height="0.9"
        color="#35d0ff"
        opacity="0.9"
        material="shader: flat; transparent: true"
        rotation="90 0 0">
      </a-cylinder>
      <a-sphere
        position="0 0 -0.9"
        radius="0.028"
        color="#a8ecff"
        opacity="0.95"
        material="shader: flat; transparent: true">
      </a-sphere>
    </a-entity>

    <!-- LIGHTING -->
    <a-entity light="type: ambient; intensity: 0.55; color: #ffffff"></a-entity>
    <a-entity light="type: directional; intensity: 0.95; color: #ffffff" position="2 4 3"></a-entity>

    <!-- ASSETS -->
    <a-assets>
      <img id="skyAimg"
        src="space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy.jpg"
        crossorigin="anonymous">

      <img id="skyBimg"
        src="space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy (1).jpg"
        crossorigin="anonymous">

      <img id="texEarth"   src="earth_tex.jpg"   crossorigin="anonymous">
      <img id="texJupiter" src="jupiter_tex.jpg" crossorigin="anonymous">
      <img id="texUranus"  src="uranus_tex.jpg"  crossorigin="anonymous">
      <img id="texMoon"    src="moon_tex.jpg"    crossorigin="anonymous">
      <img id="texSaturn"  src="saturn_tex.jpg"  crossorigin="anonymous">
    </a-assets>

    <!-- SKY RIG -->
    <a-entity id="skyRig">
      <a-sky id="skyA"
        src="#skyAimg"
        material="shader: flat; transparent: true; opacity: 1.0; side: back">
      </a-sky>

      <a-sky id="skyB"
        src="#skyBimg"
        material="shader: flat; transparent: true; opacity: 0.0; side: back">
      </a-sky>
    </a-entity>

    <!-- PLANETS -->
    <a-sphere radius="0.42" position="-11 3.6 -18"
      material="src: #texMoon"
      animation="property: rotation; to: 0 360 0; dur: 20000; loop: true">
    </a-sphere>

    <a-sphere radius="0.6" position="-6.2 1.2 -11"
      material="src: #texEarth"
      animation="property: rotation; to: 0 360 0; dur: 20000; loop: true">
    </a-sphere>

    <a-sphere radius="0.95" position="0 2.7 -9"
      material="src: #texJupiter"
      animation="property: rotation; to: 0 360 0; dur: 20000; loop: true">
    </a-sphere>

    <a-sphere radius="0.7" position="7 1.9 -15.5"
      material="src: #texUranus"
      animation="property: rotation; to: 0 360 0; dur: 20000; loop: true">
    </a-sphere>

    <a-sphere radius="0.85" position="12 3.2 -12.5"
      material="src: #texSaturn"
      animation="property: rotation; to: 0 360 0; dur: 20000; loop: true">
    </a-sphere>

    <a-ring
      position="12 3.2 -12.5"
      rotation="75 0 0"
      radius-inner="1.05"
      radius-outer="1.55"
      material="color: #c9b8a6; opacity: 0.35; transparent: true; side: double">
    </a-ring>

    <!-- WINAMP VISUAL LAYER -->
    <a-entity id="visualRig">
      <a-entity id="starfieldFX"></a-entity>
      <a-entity id="burstFX"></a-entity>

      <a-sphere
        id="pulseShell"
        radius="38"
        position="0 1.6 0"
        material="shader: flat; color: #ff4fd8; side: back; transparent: true; opacity: 0.0">
      </a-sphere>

      <!-- moved separate from main player -->
      <a-entity id="eqPanel" position="-1.95 1.00 -2.5">
        <a-plane width="0.95" height="0.68" color="#0a0610" opacity="0.82"></a-plane>
        <a-text
          value="WINAMP COSMIC EQ"
          position="0 0.22 0.02"
          align="center"
          width="1.5"
          color="#d7ff6a">
        </a-text>
        <a-entity id="eqBars" position="-0.34 -0.17 0.03"></a-entity>
      </a-entity>
    </a-entity>

    <script>
      (function () {
        const SWIRL_MS = 60000;
        const SWAP_MS = 45000;
        const FADE_MS = 1600;

        const rig = document.getElementById('skyRig');
        const A = document.getElementById('skyA');
        const B = document.getElementById('skyB');

        let showA = true;

        rig.setAttribute('animation__swirl', {
          property: 'rotation',
          from: '0 0 0',
          to: '0 360 0',
          dur: SWIRL_MS,
          easing: 'linear',
          loop: true
        });

        function fade(inEl, outEl) {
          inEl.setAttribute('animation__in', {
            property: 'material.opacity',
            from: 0,
            to: 1,
            dur: FADE_MS,
            easing: 'easeInOutQuad'
          });

          outEl.setAttribute('animation__out', {
            property: 'material.opacity',
            from: 1,
            to: 0,
            dur: FADE_MS,
            easing: 'easeInOutQuad'
          });
        }

        setInterval(() => {
          showA ? fade(B, A) : fade(A, B);
          showA = !showA;
        }, SWAP_MS);
      })();

      (function () {
        const SONG_BASE = "https://pub-180861afe41148b8acd08af4e87da48b.r2.dev/Music/tree/";

        const songs = [
          "01 STARSET - A BRIEF HISTORY OF THE FUTURE.mp3",
          "01 STARSET - praesens.mp3",
          "01 STARSET - The Order.mp3",
          "01 STARSET - UNVEILING THE ARCHITECTURE.mp3",
          "02 STARSET - DEGENERATE.mp3",
          "02 STARSET - MANIFEST.mp3",
          "02 STARSET - Satellite.mp3",
          "02 STARSET - THE BREACH.mp3",
          "03 STARSET - ECHO.mp3",
          "03 STARSET - Frequency.mp3",
          "03 STARSET - OTHERWORLDLY.mp3",
          "03 STARSET - SILOS.mp3",
          "04 STARSET - Die For You.mp3",
          "04 STARSET - ICARUS.mp3",
          "04 STARSET - rise of messenger.mp3",
          "04 STARSET - WHERE THE SKIES END.mp3",
          "05 STARSET - DARK THINGS.mp3",
          "05 STARSET - EARTHRISE.mp3",
          "05 STARSET - PERFECT MACHINE.mp3",
          "05 STARSET - Ricochet.mp3",
          "06 STARSET - LEAVING THIS WORLD BEHIND.mp3",
          "06 STARSET - SHATTERED DREAMS.mp3",
          "06 STARSET - Starlight.mp3",
          "06 STARSET - TELEKINETIC.mp3",
          "07 STARSET - DEVOLUTION.mp3",
          "07 STARSET - Into The Unknown.mp3",
          "07 STARSET - STRATOSPHERE.mp3",
          "07 STARSET - temple of milton.mp3",
          "08 STARSET - ANNIHILATED LOVE.mp3",
          "08 STARSET - BRAVE NEW WORLD.mp3",
          "08 STARSET - FAULTLINE.mp3",
          "08 STARSET - Gravity Of You.mp3",
          "09 STARSET - ALCHEMY.mp3",
          "09 STARSET - Back To The Earth.mp3",
          "09 STARSET - DYSTOPIA.mp3",
          "09 STARSET - SOLSTICE.mp3",
          "10 STARSET - DISAPPEAR.mp3",
          "10 STARSET - HEAD OVER HEELS.mp3",
          "10 STARSET - Last To Fall.mp3",
          "10 STARSET - TRIALS.mp3",
          "11 STARSET - Bringing It Down.mp3",
          "11 STARSET - SWAY.mp3",
          "11 STARSET - THIS ENDLESS ENDEAVOR.mp3",
          "11 STARSET - WAKING UP.mp3",
          "12 STARSET - OTHER WORLDS THAN THESE.mp3",
          "12 STARSET - SYMBIOTIC.mp3",
          "12 STARSET - the antihero's journey.mp3",
          "12 STARSET - Unbecoming.mp3",
          "13 STARSET - DIVING BELL.mp3",
          "13 STARSET - DREAMCATCHER.mp3",
          "13 STARSET - Monster.mp3",
          "13 STARSET - TOKSIK.mp3",
          "14 STARSET - at his altar.mp3",
          "14 STARSET - Telepathic.mp3",
          "14 STARSET - TUNNELVISION.mp3",
          "15 STARSET - AD ASTRA.mp3",
          "15 STARSET - Everglow.mp3",
          "15 STARSET - INFECTED.mp3",
          "16 STARSET - requiem of the order.mp3",
          "16 STARSET - SOMETHING WICKED.mp3"
        ];

        const audio = document.getElementById("audioPlayer");
        const nowPlaying = document.getElementById("nowPlaying");
        const status = document.getElementById("playerStatus");
        const playPauseBtn = document.getElementById("playPauseBtn");
        const nextBtn = document.getElementById("nextBtn");
        const prevBtn = document.getElementById("prevBtn");
        const volumeSlider = document.getElementById("volumeSlider");
        const vrNowPlaying = document.getElementById("vrNowPlaying");
        const vrStatus = document.getElementById("vrStatus");
        const vrPlayPauseBtn = document.getElementById("vrPlayPauseBtn");
        const vrPlayPauseLabel = document.getElementById("vrPlayPauseLabel");
        const vrPrevBtn = document.getElementById("vrPrevBtn");
        const vrNextBtn = document.getElementById("vrNextBtn");
        const vrVolDownBtn = document.getElementById("vrVolDownBtn");
        const vrVolUpBtn = document.getElementById("vrVolUpBtn");
        const vrVolText = document.getElementById("vrVolText");

        let currentIndex = 0;

        function encodeSongFile(name) {
          return String(name).trim().replaceAll(" ", "%20");
        }

        function songUrl(name) {
          return SONG_BASE + encodeSongFile(name);
        }

        function setStatus(text) {
          status.textContent = text;
          vrStatus.setAttribute("value", text);
        }

        function setNowPlaying() {
          const title = songs[currentIndex] || "No songs loaded";
          nowPlaying.textContent = title;
          vrNowPlaying.setAttribute("value", title);
        }

        function updateVolumeText() {
          const pct = Math.round(audio.volume * 100);
          vrVolText.setAttribute("value", `${pct}%`);
        }

        function setButtonState(isPlaying) {
          playPauseBtn.textContent = isPlaying ? "⏸ Pause" : "▶ Play";
          vrPlayPauseLabel.setAttribute("value", isPlaying ? "PAUSE" : "PLAY");
          vrPlayPauseBtn.setAttribute("color", isPlaying ? "#8a2f6b" : "#6e2958");
        }

        function setSong(index) {
          currentIndex = (index + songs.length) % songs.length;
          audio.src = songUrl(songs[currentIndex]);
          setNowPlaying();
        }

        async function playSong(index = currentIndex) {
          setSong(index);
          try {
            await audio.play();
            setButtonState(true);
            setStatus(`Playing ${currentIndex + 1} of ${songs.length}`);
          } catch (err) {
            console.error("Audio play failed:", err);
            setButtonState(false);
            setStatus("Play was blocked");
          }
        }

        async function togglePlayPause() {
          try {
            if (!audio.src) {
              await playSong(currentIndex);
              return;
            }

            if (audio.paused) {
              await audio.play();
              setButtonState(true);
              setStatus(`Playing ${currentIndex + 1} of ${songs.length}`);
            } else {
              audio.pause();
              setButtonState(false);
              setStatus("Paused");
            }
          } catch (err) {
            console.error("Toggle failed:", err);
            setStatus("Play was blocked");
          }
        }

        async function nextSong() {
          await playSong(currentIndex + 1);
        }

        async function prevSong() {
          await playSong(currentIndex - 1);
        }

        function changeVolume(amount) {
          const newVol = Math.max(0, Math.min(1, audio.volume + amount));
          audio.volume = newVol;
          volumeSlider.value = newVol.toFixed(2);
          updateVolumeText();
          setStatus(`Volume ${Math.round(newVol * 100)}%`);
        }

        nextBtn.addEventListener("click", nextSong);
        prevBtn.addEventListener("click", prevSong);
        playPauseBtn.addEventListener("click", togglePlayPause);

        vrNextBtn.addEventListener("click", nextSong);
        vrPrevBtn.addEventListener("click", prevSong);
        vrPlayPauseBtn.addEventListener("click", togglePlayPause);
        vrVolDownBtn.addEventListener("click", () => changeVolume(-0.1));
        vrVolUpBtn.addEventListener("click", () => changeVolume(0.1));

        volumeSlider.addEventListener("input", () => {
          audio.volume = parseFloat(volumeSlider.value);
          updateVolumeText();
          setStatus(`Volume ${Math.round(audio.volume * 100)}%`);
        });

        [vrPrevBtn, vrPlayPauseBtn, vrNextBtn, vrVolDownBtn, vrVolUpBtn].forEach(el => {
          const baseColor = el.getAttribute("color");
          el.addEventListener("mouseenter", () => {
            el.setAttribute("scale", "1.08 1.08 1");
            el.setAttribute("opacity", "0.92");
          });
          el.addEventListener("mouseleave", () => {
            el.setAttribute("scale", "1 1 1");
            el.setAttribute("opacity", "1");
            if (el === vrPlayPauseBtn) {
              el.setAttribute("color", audio.paused ? "#6e2958" : "#8a2f6b");
            } else {
              el.setAttribute("color", baseColor);
            }
          });
        });

        audio.addEventListener("ended", nextSong);
        audio.addEventListener("play", () => setButtonState(true));
        audio.addEventListener("pause", () => {
          if (!audio.ended) setButtonState(false);
        });

        audio.addEventListener("error", () => {
          console.error("Track failed:", audio.src);
          setStatus(`Track failed: ${songs[currentIndex]}`);
        });

        audio.volume = parseFloat(volumeSlider.value || "0.85");
        updateVolumeText();
        setNowPlaying();
        setStatus(`Playlist loaded: ${songs.length} songs`);
        setButtonState(false);
      })();

      (function () {
        const audio = document.getElementById("audioPlayer");
        const starfieldFX = document.getElementById("starfieldFX");
        const burstFX = document.getElementById("burstFX");
        const pulseShell = document.getElementById("pulseShell");
        const eqBars = document.getElementById("eqBars");

        if (!audio || !starfieldFX || !burstFX || !pulseShell || !eqBars) return;

        const bars = [];
        for (let i = 0; i < 12; i++) {
          const bar = document.createElement("a-box");
          bar.setAttribute("width", "0.045");
          bar.setAttribute("depth", "0.04");
          bar.setAttribute("height", "0.12");
          bar.setAttribute("color", i < 4 ? "#7cff5b" : i < 8 ? "#ffd84d" : "#ff4fd8");
          bar.setAttribute("position", `${i * 0.065} 0 0`);
          eqBars.appendChild(bar);
          bars.push(bar);
        }

        function currentSongName() {
          const src = audio.src || "";
          try {
            return decodeURIComponent(src.split("/").pop() || "").toLowerCase();
          } catch {
            return src.toLowerCase();
          }
        }

        function getMood(song = "") {
          if (
            song.includes("manifest") ||
            song.includes("breach") ||
            song.includes("frequency") ||
            song.includes("degen") ||
            song.includes("devolution") ||
            song.includes("trials") ||
            song.includes("infected")
          ) {
            return { speed: 1.25, burstRate: 0.05, pulse: 0.10, chaos: 0.9, color: "#ff4fd8" };
          }

          if (
            song.includes("earthrise") ||
            song.includes("starlight") ||
            song.includes("everglow") ||
            song.includes("telepathic") ||
            song.includes("perfect machine") ||
            song.includes("satellite")
          ) {
            return { speed: 0.42, burstRate: 0.015, pulse: 0.04, chaos: 0.28, color: "#7ad7ff" };
          }

          if (
            song.includes("monster") ||
            song.includes("telekinetic") ||
            song.includes("alchemy") ||
            song.includes("dystopia") ||
            song.includes("toksik") ||
            song.includes("brave new world")
          ) {
            return { speed: 0.95, burstRate: 0.035, pulse: 0.08, chaos: 0.65, color: "#ff7a7a" };
          }

          return { speed: 0.62, burstRate: 0.022, pulse: 0.06, chaos: 0.45, color: "#d66bff" };
        }

        const stars = [];
        function makeStar() {
          const star = document.createElement("a-sphere");
          const x = (Math.random() * 24) - 12;
          const y = 4 + Math.random() * 10;
          const z = -6 - Math.random() * 24;
          const r = 0.012 + Math.random() * 0.022;

          star.setAttribute("radius", r.toFixed(3));
          star.setAttribute("position", `${x} ${y} ${z}`);
          star.setAttribute("material", "shader: flat; color: #ffffff; emissive: #ffffff; emissiveIntensity: 1");
          starfieldFX.appendChild(star);

          stars.push({
            el: star,
            x, y, z,
            vy: 0.002 + Math.random() * 0.006,
            vx: (Math.random() - 0.5) * 0.004
          });
        }

        for (let i = 0; i < 70; i++) makeStar();

        function makeBurst(color = "#ffd2fa") {
          const burst = document.createElement("a-sphere");
          const x = (Math.random() * 18) - 9;
          const y = (Math.random() * 8) + 1;
          const z = -8 - Math.random() * 18;

          burst.setAttribute("radius", "0.08");
          burst.setAttribute("position", `${x} ${y} ${z}`);
          burst.setAttribute("material", `shader: flat; color: ${color}; transparent: true; opacity: 0.55`);
          burstFX.appendChild(burst);

          let scale = 0.2;
          let opacity = 0.55;

          function anim() {
            scale += 0.06;
            opacity -= 0.025;
            burst.setAttribute("scale", `${scale} ${scale} ${scale}`);
            burst.setAttribute("material", `shader: flat; color: ${color}; transparent: true; opacity: ${Math.max(opacity, 0)}`);
            if (opacity > 0) {
              requestAnimationFrame(anim);
            } else {
              burst.remove();
            }
          }

          requestAnimationFrame(anim);
        }

        let t = 0;
        function tick() {
          const playing = !audio.paused && !audio.ended && !!audio.src;
          const mood = getMood(currentSongName());

          for (const s of stars) {
            if (playing) {
              s.y -= s.vy * mood.speed;
              s.x += s.vx * mood.chaos;
            }

            if (s.y < -2.5 || s.x < -14 || s.x > 14) {
              s.x = (Math.random() * 24) - 12;
              s.y = 5 + Math.random() * 10;
              s.z = -6 - Math.random() * 24;
            }

            s.el.setAttribute("position", `${s.x} ${s.y} ${s.z}`);
          }

          if (playing) {
            const pulse = (Math.sin(t * 0.08) * 0.5 + 0.5) * mood.pulse;
            pulseShell.setAttribute(
              "material",
              `shader: flat; color: ${mood.color}; side: back; transparent: true; opacity: ${pulse.toFixed(3)}`
            );
          } else {
            pulseShell.setAttribute(
              "material",
              "shader: flat; color: #ff4fd8; side: back; transparent: true; opacity: 0.0"
            );
          }

          bars.forEach((bar, i) => {
            const base = playing ? 0.07 : 0.035;
            const wobble = playing
              ? (Math.sin((t * 0.12) + i * 0.6) * 0.16 + 0.18) * mood.speed
              : 0.015;
            const h = Math.max(base + wobble, 0.03);

            bar.setAttribute("height", h.toFixed(3));
            bar.setAttribute("position", `${i * 0.065} ${(h / 2) - 0.02} 0`);
          });

          if (playing && Math.random() < mood.burstRate) {
            makeBurst(mood.color);
          }

          t += 1;
          requestAnimationFrame(tick);
        }

        tick();
      })();
    </script>

  </a-scene>
</body>
</html>
