<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Korndog Cosmic Drift — Planetarium Mode + STARSET</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .hud {
      position: fixed;
      left: 12px;
      bottom: 10px;
      z-index: 20;
      font: 14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: rgba(255,255,255,.85);
      text-shadow: 0 2px 10px rgba(0,0,0,.75);
      user-select: none;
      pointer-events: none;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(3px);
    }

    .player-ui {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 30;
      width: min(92vw, 360px);
      color: #fff;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .player-title {
      font-size: 13px;
      opacity: .75;
      margin-bottom: 6px;
    }

    .now-playing {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .controls button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 10px 8px;
      font-weight: 700;
      font-size: 14px;
      background: rgba(255,255,255,.12);
      color: #fff;
    }

    .controls button:active {
      transform: scale(.98);
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      opacity: .92;
    }

    .volume-wrap input[type="range"] {
      flex: 1;
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      opacity: .75;
      min-height: 16px;
    }

    .a-enter-vr-button {
      border-radius: 14px !important;
    }

    audio {
      display: none;
    }
  </style>
</head>

<body>
  <div class="hud">
    Auto background swap • Planetarium swirl • Planets spin • rig-locked
  </div>

  <div class="player-ui">
    <div class="player-title">Brandi’s Universe • STARSET Cloud Player</div>
    <div class="now-playing" id="nowPlaying">Loading playlist...</div>

    <div class="controls">
      <button id="prevBtn">⏮ Prev</button>
      <button id="playPauseBtn">▶ Play</button>
      <button id="nextBtn">Next ⏭</button>
    </div>

    <div class="volume-wrap">
      <span>Vol</span>
      <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.85" />
    </div>

    <div class="status" id="playerStatus">Looking for playlist...</div>
  </div>

  <audio id="audioPlayer" preload="auto" crossorigin="anonymous"></audio>

  <a-scene
    vr-mode-ui="enabled: true"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
    background="color: #000"
  >

    <a-entity id="rig" position="0 1.6 0">
      <a-camera
        wasd-controls-enabled="false"
        look-controls="pointerLockEnabled: false"
        fov="78"
      ></a-camera>
    </a-entity>

    <a-entity light="type: ambient; intensity: 0.55; color: #ffffff"></a-entity>
    <a-entity light="type: directional; intensity: 0.95; color: #ffffff" position="2 4 3"></a-entity>

    <a-assets>
      <img id="skyAimg"
        src="space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy.jpg"
        crossorigin="anonymous">

      <img id="skyBimg"
        src="space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy (1).jpg"
        crossorigin="anonymous">

      <img id="texEarth"   src="earth_tex.jpg"   crossorigin="anonymous">
      <img id="texJupiter" src="jupiter_tex.jpg" crossorigin="anonymous">
      <img id="texUranus"  src="uranus_tex.jpg"  crossorigin="anonymous">
      <img id="texMoon"    src="moon_tex.jpg"    crossorigin="anonymous">
      <img id="texSaturn"  src="saturn_tex.jpg"  crossorigin="anonymous">
    </a-assets>

    <a-entity id="skyRig">
      <a-sky id="skyA"
        src="#skyAimg"
        material="shader: flat; transparent: true; opacity: 1.0; side: back">
      </a-sky>

      <a-sky id="skyB"
        src="#skyBimg"
        material="shader: flat; transparent: true; opacity: 0.0; side: back">
      </a-sky>
    </a-entity>

    <a-sphere radius="0.42" position="-11 3.6 -18"
      material="src: #texMoon"
      animation="property: rotation; to: 0 360 0; dur: 20000; loop: true">
    </a-sphere>

    <a-sphere radius="0.6" position="-6.2 1.2 -11"
      material="src: #texEarth"
      animation="property: rotation; to: 0 360 0; dur: 20000; loop: true">
    </a-sphere>

    <a-sphere radius="0.95" position="0 2.7 -9"
      material="src: #texJupiter"
      animation="property: rotation; to: 0 360 0; dur: 20000; loop: true">
    </a-sphere>

    <a-sphere radius="0.7" position="7 1.9 -15.5"
      material="src: #texUranus"
      animation="property: rotation; to: 0 360 0; dur: 20000; loop: true">
    </a-sphere>

    <a-sphere radius="0.85" position="12 3.2 -12.5"
      material="src: #texSaturn"
      animation="property: rotation; to: 0 360 0; dur: 20000; loop: true">
    </a-sphere>

    <a-ring
      position="12 3.2 -12.5"
      rotation="75 0 0"
      radius-inner="1.05"
      radius-outer="1.55"
      material="color: #c9b8a6; opacity: 0.35; transparent: true; side: double">
    </a-ring>

    <script>
      // VISUALS - untouched behavior
      (function () {
        const SWIRL_MS = 60000;
        const SWAP_MS = 45000;
        const FADE_MS = 1600;

        const rig = document.getElementById('skyRig');
        const A = document.getElementById('skyA');
        const B = document.getElementById('skyB');

        let showA = true;

        rig.setAttribute('animation__swirl', {
          property: 'rotation',
          from: '0 0 0',
          to: '0 360 0',
          dur: SWIRL_MS,
          easing: 'linear',
          loop: true
        });

        function fade(inEl, outEl) {
          inEl.setAttribute('animation__in', {
            property: 'material.opacity',
            from: 0,
            to: 1,
            dur: FADE_MS,
            easing: 'easeInOutQuad'
          });

          outEl.setAttribute('animation__out', {
            property: 'material.opacity',
            from: 1,
            to: 0,
            dur: FADE_MS,
            easing: 'easeInOutQuad'
          });
        }

        setInterval(() => {
          showA ? fade(B, A) : fade(A, B);
          showA = !showA;
        }, SWAP_MS);
      })();

      // MUSIC - tougher and less picky
      (function () {
        const PLAYLIST_URLS = [
          "https://pub-180861afe41148b8acd08af4e87da48b.r2.dev/Music/tree/playlist.json",
          "https://pub-180861afe41148b8acd08af4e87da48b.r2.dev/Music/tree/playlist_fixed.json"
        ];

        const SONG_BASE = "https://pub-180861afe41148b8acd08af4e87da48b.r2.dev/Music/tree/";

        const audio = document.getElementById("audioPlayer");
        const nowPlaying = document.getElementById("nowPlaying");
        const status = document.getElementById("playerStatus");
        const playPauseBtn = document.getElementById("playPauseBtn");
        const nextBtn = document.getElementById("nextBtn");
        const prevBtn = document.getElementById("prevBtn");
        const volumeSlider = document.getElementById("volumeSlider");

        let songs = [];
        let currentIndex = 0;
        let playlistReady = false;

        audio.volume = parseFloat(volumeSlider.value || "0.85");

        volumeSlider.addEventListener("input", () => {
          audio.volume = parseFloat(volumeSlider.value);
        });

        function cleanSongName(name) {
          return String(name || "")
            .replace(/^\uFEFF/, "")
            .trim();
        }

        function encodeSongFile(name) {
          return encodeURIComponent(cleanSongName(name))
            .replace(/%2F/g, "/");
        }

        function songUrl(name) {
          return SONG_BASE + encodeSongFile(name);
        }

        function setNowPlaying() {
          if (!songs.length) {
            nowPlaying.textContent = "No songs loaded";
            return;
          }
          nowPlaying.textContent = songs[currentIndex];
        }

        function loadSong(index, autoplay = false) {
          if (!songs.length) return;

          currentIndex = (index + songs.length) % songs.length;
          const name = cleanSongName(songs[currentIndex]);

          audio.src = songUrl(name);
          audio.load();

          setNowPlaying();
          status.textContent = `Loaded ${currentIndex + 1} of ${songs.length}`;

          if (autoplay) {
            audio.play()
              .then(() => {
                playPauseBtn.textContent = "⏸ Pause";
                status.textContent = `Playing ${currentIndex + 1} of ${songs.length}`;
              })
              .catch((err) => {
                console.error("Play blocked:", err);
                playPauseBtn.textContent = "▶ Play";
                status.textContent = "Tap Play to start audio";
              });
          } else {
            playPauseBtn.textContent = "▶ Play";
          }
        }

        function nextSong() {
          if (!playlistReady) return;
          loadSong(currentIndex + 1, true);
        }

        function prevSong() {
          if (!playlistReady) return;
          loadSong(currentIndex - 1, true);
        }

        function togglePlayPause() {
          if (!playlistReady) return;

          if (!audio.src) {
            loadSong(currentIndex, true);
            return;
          }

          if (audio.paused) {
            audio.play()
              .then(() => {
                playPauseBtn.textContent = "⏸ Pause";
                status.textContent = `Playing ${currentIndex + 1} of ${songs.length}`;
              })
              .catch((err) => {
                console.error("Play failed:", err);
                status.textContent = "Tap Play again";
              });
          } else {
            audio.pause();
            playPauseBtn.textContent = "▶ Play";
            status.textContent = "Paused";
          }
        }

        async function fetchPlaylistText(url) {
          const res = await fetch(url, {
            method: "GET",
            cache: "no-store"
          });

          if (!res.ok) {
            throw new Error(`Playlist fetch failed: ${res.status}`);
          }

          return await res.text();
        }

        function parsePlaylistText(text) {
          const cleaned = text.replace(/^\uFEFF/, "").trim();
          const data = JSON.parse(cleaned);

          if (!data.songs || !Array.isArray(data.songs) || !data.songs.length) {
            throw new Error("Playlist JSON has no songs array");
          }

          return data.songs.map(cleanSongName).filter(Boolean);
        }

        async function loadPlaylist() {
          let lastError = null;

          for (const url of PLAYLIST_URLS) {
            try {
              status.textContent = `Trying playlist: ${url.split('/').pop()}`;
              const text = await fetchPlaylistText(url);
              const parsedSongs = parsePlaylistText(text);

              songs = parsedSongs;
              playlistReady = true;
              currentIndex = 0;

              setNowPlaying();
              status.textContent = `Playlist loaded: ${songs.length} songs`;
              console.log("Playlist loaded from:", url);
              return;
            } catch (err) {
              console.error("Playlist attempt failed:", url, err);
              lastError = err;
            }
          }

          nowPlaying.textContent = "Playlist failed to load";
          status.textContent = lastError ? lastError.message : "Unknown playlist error";
        }

        nextBtn.addEventListener("click", nextSong);
        prevBtn.addEventListener("click", prevSong);
        playPauseBtn.addEventListener("click", togglePlayPause);

        audio.addEventListener("ended", nextSong);

        audio.addEventListener("play", () => {
          playPauseBtn.textContent = "⏸ Pause";
        });

        audio.addEventListener("pause", () => {
          if (!audio.ended) {
            playPauseBtn.textContent = "▶ Play";
          }
        });

        audio.addEventListener("error", () => {
          const failedSong = songs[currentIndex] || "Unknown song";
          status.textContent = `Track failed: ${failedSong}`;
          console.error("Audio failed for:", audio.src);
        });

        loadPlaylist();
      })();
    </script>

  </a-scene>
</body>
</html>
