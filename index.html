<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brandi's Universe</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>

html,body{
margin:0;
height:100%;
background:black;
overflow:hidden;
font-family:Arial;
color:white;
}

.player{
position:fixed;
right:12px;
bottom:12px;
width:340px;
background:rgba(0,0,0,.6);
padding:14px;
border-radius:12px;
backdrop-filter:blur(8px);
border:1px solid rgba(255,255,255,.15);
z-index:9999;
}

.player-title{
font-size:13px;
opacity:.85;
margin-bottom:8px;
}

#song{
font-weight:bold;
font-size:14px;
margin-bottom:10px;
}

.controls{
display:flex;
gap:8px;
margin-top:8px;
}

button{
flex:1;
padding:10px;
border-radius:8px;
border:none;
background:#222;
color:white;
font-weight:bold;
}

button:hover{
background:#444;
}

.volume{
margin-top:8px;
}

</style>
</head>

<body>

<div class="player">

<div class="player-title">
Brandi’s Universe • STARSET Cloud Player
</div>

<div id="song">Ready</div>

<audio id="audio" controls preload="metadata" playsinline webkit-playsinline style="width:100%;"></audio>

<div class="controls">
<button id="prev">Prev</button>
<button id="next">Next</button>
</div>

<div class="volume">
Volume
<input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
</div>

</div>

<a-scene>

<a-assets>

<img id="sky1" src="space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy.jpg">

<img id="sky2" src="space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy (1).jpg">

</a-assets>

<a-sky id="sky" src="#sky1"></a-sky>

<a-entity light="type:ambient;intensity:1"></a-entity>

</a-scene>

<script>

const BASE="https://pub-180861afe41148b8acd08af4e87da48b.r2.dev/Music/tree/";

const songs=[

"16 STARSET - requiem of the order.mp3",
"16 STARSET - SOMETHING WICKED.mp3"

];

const audio=document.getElementById("audio");
const song=document.getElementById("song");

let index=0;

function url(name){

return BASE + name.replaceAll(" ","%20");

}

function load(n){

index=(n+songs.length)%songs.length;

audio.src=url(songs[index]);

song.innerText=songs[index];

}

document.getElementById("next").onclick=()=>{

load(index+1);

audio.play();

};

document.getElementById("prev").onclick=()=>{

load(index-1);

audio.play();

};

document.getElementById("volume").oninput=(e)=>{

audio.volume=e.target.value;

};

audio.addEventListener("ended",()=>{

load(index+1);

audio.play();

});

audio.volume=.8;

load(0);


/* background swap */

const sky=document.getElementById("sky");

let toggle=true;

setInterval(()=>{

sky.setAttribute("src",toggle?"#sky2":"#sky1");

toggle=!toggle;

},45000);

</script>

</body>
</html>
