<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brandi's Universe — Cosmic v2</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: #fff;
}

.player {
  position: fixed;
  right: 12px;
  bottom: 12px;
  width: 340px;
  background: rgba(0,0,0,.62);
  padding: 14px;
  border-radius: 12px;
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,.15);
  z-index: 9999;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}

.player-title {
  font-size: 13px;
  opacity: .85;
  margin-bottom: 8px;
}

#song {
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 10px;
  line-height: 1.25;
  word-break: break-word;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

button {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #222;
  color: #fff;
  font-weight: bold;
}

button:hover {
  background: #444;
}

.volume {
  margin-top: 8px;
}

#status {
  margin-top: 8px;
  font-size: 12px;
  opacity: .85;
  min-height: 16px;
}

audio {
  width: 100%;
}
</style>
</head>
<body>

<div class="player">
  <div class="player-title">Brandi’s Universe • STARSET Cosmic Player</div>

  <div id="song">Ready</div>

  <audio id="audio" controls preload="metadata" playsinline webkit-playsinline></audio>

  <div class="controls">
    <button id="prev">Prev</button>
    <button id="next">Next</button>
  </div>

  <div class="volume">
    Volume
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
  </div>

  <div id="status">Universe online</div>
</div>

<a-scene background="color:#000">
  <a-assets>
    <!-- locked base working backgrounds -->
    <img id="sky1" src="./space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy.jpg">
    <img id="sky2" src="./space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy (1).jpg">

    <!-- safe assets -->
    <img id="nebula1" src="./nebula-overlay-1.jpg">
    <img id="nebula2" src="./nebula-overlay-2.png">
    <img id="starfieldOverlay" src="./starfield-overlay.png">
    <img id="meteorStreak" src="./meteor-streak.png">
  </a-assets>

  <a-entity light="type: ambient; intensity: 1.0"></a-entity>

  <a-entity id="cameraRig" position="0 1.6 0">
    <a-camera></a-camera>
  </a-entity>

  <!-- universe rig -->
  <a-entity id="universeRig">
    <a-sky id="sky" src="#sky1"></a-sky>

    <!-- far sparkle depth -->
    <a-plane
      id="starsFar"
      src="#starfieldOverlay"
      position="0 10 -52"
      width="135"
      height="78"
      material="shader: flat; transparent: true; opacity: 0.24; alphaTest: 0.02">
    </a-plane>

    <a-plane
      id="starsLeft"
      src="#starfieldOverlay"
      position="-42 10 -38"
      rotation="0 38 0"
      width="78"
      height="48"
      material="shader: flat; transparent: true; opacity: 0.16; alphaTest: 0.02">
    </a-plane>

    <a-plane
      id="starsRight"
      src="#starfieldOverlay"
      position="42 6 -38"
      rotation="0 -38 0"
      width="78"
      height="48"
      material="shader: flat; transparent: true; opacity: 0.16; alphaTest: 0.02">
    </a-plane>

    <!-- dramatic distant nebula landmark -->
    <a-plane
      id="bubbleNebula"
      src="#nebula1"
      position="-24 12 -62"
      rotation="0 22 0"
      width="26"
      height="26"
      material="shader: flat; transparent: true; opacity: 0.92">
    </a-plane>

    <!-- main safe drifting purple nebula -->
    <a-plane
      id="fogMain"
      src="#nebula2"
      position="0 6 -26"
      width="34"
      height="22"
      material="shader: flat; transparent: true; opacity: 0.42; alphaTest: 0.02; blending: additive">
    </a-plane>

    <a-plane
      id="fogLeft"
      src="#nebula2"
      position="-18 9 -22"
      rotation="0 24 0"
      width="18"
      height="14"
      material="shader: flat; transparent: true; opacity: 0.24; alphaTest: 0.02; blending: additive">
    </a-plane>

    <a-plane
      id="fogRight"
      src="#nebula2"
      position="18 3 -22"
      rotation="0 -24 0"
      width="18"
      height="14"
      material="shader: flat; transparent: true; opacity: 0.24; alphaTest: 0.02; blending: additive">
    </a-plane>

    <!-- extra distant nebula glow -->
    <a-plane
      id="fogFar"
      src="#nebula2"
      position="20 16 -54"
      rotation="0 -18 0"
      width="26"
      height="20"
      material="shader: flat; transparent: true; opacity: 0.18; alphaTest: 0.02; blending: additive">
    </a-plane>

    <!-- meteor -->
    <a-plane
      id="meteorPlane"
      src="#meteorStreak"
      position="-20 14 -24"
      width="9"
      height="4"
      visible="false"
      material="shader: flat; transparent: true; opacity: 0.0; alphaTest: 0.02; blending: additive">
    </a-plane>

    <!-- subtle universe pulse -->
    <a-sphere
      id="pulseShell"
      radius="36"
      position="0 0 0"
      material="shader: flat; color: #8f63ff; side: back; transparent: true; opacity: 0.0">
    </a-sphere>
  </a-entity>
</a-scene>

<script>
/* --------------------------
   MUSIC / PLAYER (unchanged logic style)
--------------------------- */
const BASE = "https://pub-180861afe41148b8acd08af4e87da48b.r2.dev/Music/tree/";

const songs = [
  "01 STARSET - A BRIEF HISTORY OF THE FUTURE.mp3",
  "01 STARSET - praesens.mp3",
  "01 STARSET - The Order.mp3",
  "01 STARSET - UNVEILING THE ARCHITECTURE.mp3",
  "02 STARSET - DEGENERATE.mp3",
  "02 STARSET - MANIFEST.mp3",
  "02 STARSET - Satellite.mp3",
  "02 STARSET - THE BREACH.mp3",
  "03 STARSET - ECHO.mp3",
  "03 STARSET - Frequency.mp3",
  "03 STARSET - OTHERWORLDLY.mp3",
  "03 STARSET - SILOS.mp3",
  "04 STARSET - Die For You.mp3",
  "04 STARSET - ICARUS.mp3",
  "04 STARSET - rise of messenger.mp3",
  "04 STARSET - WHERE THE SKIES END.mp3",
  "05 STARSET - DARK THINGS.mp3",
  "05 STARSET - EARTHRISE.mp3",
  "05 STARSET - PERFECT MACHINE.mp3",
  "05 STARSET - Ricochet.mp3",
  "06 STARSET - LEAVING THIS WORLD BEHIND.mp3",
  "06 STARSET - SHATTERED DREAMS.mp3",
  "06 STARSET - Starlight.mp3",
  "06 STARSET - TELEKINETIC.mp3",
  "07 STARSET - DEVOLUTION.mp3",
  "07 STARSET - Into The Unknown.mp3",
  "07 STARSET - STRATOSPHERE.mp3",
  "07 STARSET - temple of milton.mp3",
  "08 STARSET - ANNIHILATED LOVE.mp3",
  "08 STARSET - BRAVE NEW WORLD.mp3",
  "08 STARSET - FAULTLINE.mp3",
  "08 STARSET - Gravity Of You.mp3",
  "09 STARSET - ALCHEMY.mp3",
  "09 STARSET - Back To The Earth.mp3",
  "09 STARSET - DYSTOPIA.mp3",
  "09 STARSET - SOLSTICE.mp3",
  "10 STARSET - DISAPPEAR.mp3",
  "10 STARSET - HEAD OVER HEELS.mp3",
  "10 STARSET - Last To Fall.mp3",
  "10 STARSET - TRIALS.mp3",
  "11 STARSET - Bringing It Down.mp3",
  "11 STARSET - SWAY.mp3",
  "11 STARSET - THIS ENDLESS ENDEAVOR.mp3",
  "11 STARSET - WAKING UP.mp3",
  "12 STARSET - OTHER WORLDS THAN THESE.mp3",
  "12 STARSET - SYMBIOTIC.mp3",
  "12 STARSET - the antihero's journey.mp3",
  "12 STARSET - Unbecoming.mp3",
  "13 STARSET - DIVING BELL.mp3",
  "13 STARSET - DREAMCATCHER.mp3",
  "13 STARSET - Monster.mp3",
  "13 STARSET - TOKSIK.mp3",
  "14 STARSET - at his altar.mp3",
  "14 STARSET - Telepathic.mp3",
  "14 STARSET - TUNNELVISION.mp3",
  "15 STARSET - AD ASTRA.mp3",
  "15 STARSET - Everglow.mp3",
  "15 STARSET - INFECTED.mp3",
  "16 STARSET - requiem of the order.mp3",
  "16 STARSET - SOMETHING WICKED.mp3"
];

const audio = document.getElementById("audio");
const song = document.getElementById("song");
const statusText = document.getElementById("status");

let index = 0;

function url(name) {
  return BASE + name.replaceAll(" ", "%20");
}

function load(n) {
  index = (n + songs.length) % songs.length;
  audio.src = url(songs[index]);
  song.innerText = songs[index];
  statusText.innerText = `Loaded ${index + 1} of ${songs.length}`;
}

document.getElementById("next").onclick = () => {
  load(index + 1);
  audio.play();
};

document.getElementById("prev").onclick = () => {
  load(index - 1);
  audio.play();
};

document.getElementById("volume").oninput = (e) => {
  audio.volume = e.target.value;
};

audio.addEventListener("ended", () => {
  load(index + 1);
  audio.play();
});

audio.addEventListener("play", () => {
  statusText.innerText = `Playing ${index + 1} of ${songs.length}`;
});

audio.addEventListener("pause", () => {
  if (!audio.ended) statusText.innerText = "Paused";
});

audio.addEventListener("error", () => {
  statusText.innerText = "Track failed to load";
});

audio.volume = 0.8;
load(0);

/* --------------------------
   VISUALS
--------------------------- */
const universeRig = document.getElementById("universeRig");
const sky = document.getElementById("sky");

const starsFar = document.getElementById("starsFar");
const starsLeft = document.getElementById("starsLeft");
const starsRight = document.getElementById("starsRight");

const fogMain = document.getElementById("fogMain");
const fogLeft = document.getElementById("fogLeft");
const fogRight = document.getElementById("fogRight");
const fogFar = document.getElementById("fogFar");
const bubbleNebula = document.getElementById("bubbleNebula");

const meteorPlane = document.getElementById("meteorPlane");
const pulseShell = document.getElementById("pulseShell");

/* keep the working base background swap */
let toggle = true;
setInterval(() => {
  sky.setAttribute("src", toggle ? "#sky2" : "#sky1");
  toggle = !toggle;
}, 45000);

let universeY = 0;
let motionPhase = 0;
let meteorActive = false;

function launchMeteor() {
  if (meteorActive) return;
  meteorActive = true;

  let x = -26;
  let y = 16 + Math.random() * 5;
  let z = -22 - Math.random() * 10;
  let opacity = 0.95;
  const angle = -18 - Math.random() * 14;

  meteorPlane.setAttribute("visible", true);
  meteorPlane.setAttribute("position", `${x} ${y} ${z}`);
  meteorPlane.setAttribute("rotation", `0 0 ${angle}`);
  meteorPlane.setAttribute("scale", "1 1 1");
  meteorPlane.setAttribute(
    "material",
    `shader: flat; transparent: true; opacity: ${opacity}; alphaTest: 0.02; blending: additive`
  );

  function animateMeteor() {
    x += 0.48;
    y -= 0.20;
    opacity -= 0.018;

    meteorPlane.setAttribute("position", `${x} ${y} ${z}`);
    meteorPlane.setAttribute(
      "material",
      `shader: flat; transparent: true; opacity: ${Math.max(opacity, 0)}; alphaTest: 0.02; blending: additive`
    );

    if (opacity > 0) {
      requestAnimationFrame(animateMeteor);
    } else {
      meteorPlane.setAttribute("visible", false);
      meteorActive = false;
    }
  }

  requestAnimationFrame(animateMeteor);
}

/* occasional meteor */
setInterval(() => {
  launchMeteor();
}, 10000 + Math.floor(Math.random() * 5000));

function animateUniverse() {
  const playing = !audio.paused && !audio.ended && !!audio.src;

  /* slow planetarium rotation */
  universeY += playing ? 0.010 : 0.004;
  universeRig.setAttribute("rotation", `0 ${universeY} 0`);

  /* layered drift */
  motionPhase += playing ? 0.010 : 0.004;

  const fogMainX = Math.sin(motionPhase * 0.70) * 2.6;
  const fogMainY = 6 + Math.cos(motionPhase * 0.42) * 0.7;
  fogMain.setAttribute("position", `${fogMainX.toFixed(2)} ${fogMainY.toFixed(2)} -26`);

  const fogLeftX = -18 + Math.cos(motionPhase * 0.56) * 1.6;
  const fogLeftY = 9 + Math.sin(motionPhase * 0.50) * 0.6;
  fogLeft.setAttribute("position", `${fogLeftX.toFixed(2)} ${fogLeftY.toFixed(2)} -22`);

  const fogRightX = 18 + Math.sin(motionPhase * 0.54) * 1.6;
  const fogRightY = 3 + Math.cos(motionPhase * 0.48) * 0.6;
  fogRight.setAttribute("position", `${fogRightX.toFixed(2)} ${fogRightY.toFixed(2)} -22`);

  const fogFarX = 20 + Math.sin(motionPhase * 0.22) * 1.2;
  const fogFarY = 16 + Math.cos(motionPhase * 0.18) * 0.8;
  fogFar.setAttribute("position", `${fogFarX.toFixed(2)} ${fogFarY.toFixed(2)} -54`);

  const bubbleScale = 1 + Math.sin(motionPhase * 0.22) * 0.025;
  bubbleNebula.setAttribute("scale", `${bubbleScale.toFixed(3)} ${bubbleScale.toFixed(3)} 1`);

  const starPulse = playing ? 0.24 + (Math.sin(motionPhase * 2.4) * 0.03) : 0.18;
  starsFar.setAttribute("material", `shader: flat; transparent: true; opacity: ${starPulse.toFixed(3)}; alphaTest: 0.02`);
  starsLeft.setAttribute("material", `shader: flat; transparent: true; opacity: ${(starPulse * 0.66).toFixed(3)}; alphaTest: 0.02`);
  starsRight.setAttribute("material", `shader: flat; transparent: true; opacity: ${(starPulse * 0.66).toFixed(3)}; alphaTest: 0.02`);

  const pulse = playing
    ? (Math.sin(motionPhase * 0.09) * 0.5 + 0.5) * 0.08
    : (Math.sin(motionPhase * 0.05) * 0.5 + 0.5) * 0.03;

  pulseShell.setAttribute(
    "material",
    `shader: flat; color: #8f63ff; side: back; transparent: true; opacity: ${pulse.toFixed(3)}`
  );

  requestAnimationFrame(animateUniverse);
}

animateUniverse();
</script>

</body>
</html>
