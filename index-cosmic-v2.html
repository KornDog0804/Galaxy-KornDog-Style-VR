<!DOCTYPE html>
<html lang="en">
<head>

<style>

html,body{
margin:0;
height:100%;
background:black;
overflow:hidden;
font-family:Arial;
color:white;
}

.player{
position:fixed;
right:12px;
bottom:12px;
width:340px;
background:rgba(0,0,0,.6);
padding:14px;
border-radius:12px;
backdrop-filter:blur(8px);
border:1px solid rgba(255,255,255,.15);
z-index:9999;
}

.player-title{
font-size:13px;
opacity:.85;
margin-bottom:8px;
}

#song{
font-weight:bold;
font-size:14px;
margin-bottom:10px;
}

.controls{
display:flex;
gap:8px;
margin-top:8px;
}

button{
flex:1;
padding:10px;
border-radius:8px;
border:none;
background:#222;
color:white;
font-weight:bold;
}

button:hover{
background:#444;
}

.volume{
margin-top:8px;
}

</style>
</head>

<body>

<div class="player">

<div class="player-title">
Brandi’s Universe • STARSET Cloud Player
</div>

<div id="song">Ready</div>

<audio id="audio" controls preload="metadata" playsinline webkit-playsinline style="width:100%;"></audio>

<div class="controls">
<button id="prev">Prev</button>
<button id="next">Next</button>
</div>

<div class="volume">
Volume
<input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
</div>

</div>

<a-scene background="color:#000">

<a-assets>

<img id="sky1" src="blue_nebulae_1.png">
<img id="sky2" src="hazy_nebulae_1.png">
<img id="sky3" src="plain_starfield_1.png">
<img id="sky4" src="ringed_gas_giant_planet.png">

<img id="meteor" src="meteor-streak.png">

</a-assets>

<a-entity light="type:ambient;intensity:1"></a-entity>

<a-entity id="rig" position="0 0 0" thumbstick-locomotion>

<a-entity id="cameraRig" position="0 1.6 0">
<a-camera look-controls></a-camera>
</a-entity>

<a-entity id="leftHand"
hand-controls="hand: left"
visible="false">
</a-entity>

<a-entity id="rightHand"
hand-controls="hand: right"
visible="false">
</a-entity>

</a-entity>

<a-sky id="sky" src="#sky1" rotation="0 -90 0"
animation="property: rotation; to: 6 270 5; dur: 220000; easing: linear; loop: true">
</a-sky>

<a-plane
src="#meteor"
position="-120 60 -110"
width="12"
height="5"
material="transparent:true"
animation="property:position;from:-120 60 -110;to:120 -10 -110;dur:5200;loop:true">
</a-plane>

<a-plane
src="#meteor"
position="-140 75 -130"
width="15"
height="6"
material="transparent:true"
animation="property:position;from:-140 75 -130;to:130 -25 -130;dur:6300;loop:true">
</a-plane>

</a-scene>

<script>

AFRAME.registerComponent('thumbstick-locomotion',{

init:function(){

this.leftX=0
this.leftY=0
this.rightX=0
this.rightY=0

this.moveSpeed=0.08
this.turnSpeed=1.7

this.onLeftThumbstickMoved=(e)=>{
this.leftX=e.detail.x||0
this.leftY=e.detail.y||0
}

this.onRightThumbstickMoved=(e)=>{
this.rightX=e.detail.x||0
this.rightY=e.detail.y||0
}

this.onEnterVR=()=>{
this.leftHand=document.querySelector('#leftHand')
this.rightHand=document.querySelector('#rightHand')

this.leftHand.addEventListener('thumbstickmoved',this.onLeftThumbstickMoved)
this.rightHand.addEventListener('thumbstickmoved',this.onRightThumbstickMoved)
}

this.onExitVR=()=>{
this.leftX=0
this.leftY=0
this.rightX=0
this.rightY=0
}

this.el.sceneEl.addEventListener('enter-vr',this.onEnterVR)
this.el.sceneEl.addEventListener('exit-vr',this.onExitVR)

},

tick:function(){

if(!this.el.sceneEl.is('vr-mode')) return

const dead=0.15

let rot=this.el.getAttribute('rotation')

let newY=rot.y
let newX=rot.x

if(Math.abs(this.rightX)>dead)
newY=rot.y-(this.rightX*this.turnSpeed)

if(Math.abs(this.rightY)>dead){
newX=rot.x+(this.rightY*1.2)
newX=Math.max(-35,Math.min(35,newX))
}

this.el.setAttribute('rotation',{
x:newX,
y:newY,
z:rot.z
})

if(Math.abs(this.leftX)>dead||Math.abs(this.leftY)>dead){

const yaw=THREE.MathUtils.degToRad(newY)

const forward=new THREE.Vector3(
-Math.sin(yaw),
0,
-Math.cos(yaw)
)

const right=new THREE.Vector3(
Math.cos(yaw),
0,
-Math.sin(yaw)
)

const move=new THREE.Vector3()

move.add(forward.multiplyScalar(-this.leftY*this.moveSpeed))
move.add(right.multiplyScalar(this.leftX*this.moveSpeed))

let pos=this.el.getAttribute('position')

this.el.setAttribute('position',{
x:pos.x+move.x,
y:pos.y,
z:pos.z+move.z
})

}

}

})

const BASE="https://pub-180861afe41148b8acd08af4e87da48b.r2.dev/Music/tree/"

const audio=document.getElementById("audio")
const song=document.getElementById("song")

let shuffled=[...songs].sort(()=>Math.random()-0.5)
let index=0

function url(name){
return BASE+name.replaceAll(" ","%20")
}

function load(n){

index=(n+shuffled.length)%shuffled.length

audio.src=url(shuffled[index])
song.innerText=shuffled[index]

}

document.getElementById("next").onclick=()=>{
load(index+1)
audio.play()
}

document.getElementById("prev").onclick=()=>{
load(index-1)
audio.play()
}

document.getElementById("volume").oninput=(e)=>{
audio.volume=e.target.value
}

audio.addEventListener("ended",()=>{
load(index+1)
audio.play()
})

audio.volume=.8

load(0)

const sky=document.getElementById("sky")

const worlds=["#sky1","#sky2","#sky3","#sky4"]

let w=0

setInterval(()=>{
w=(w+1)%worlds.length
sky.setAttribute("src",worlds[w])
},60000)

</script>
