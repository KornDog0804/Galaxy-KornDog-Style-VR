<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brandi's Universe — Cosmic v2</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
html,body{
  margin:0;
  height:100%;
  background:black;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
}

.player{
  position:fixed;
  right:12px;
  bottom:12px;
  width:340px;
  background:rgba(0,0,0,.62);
  padding:14px;
  border-radius:12px;
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.15);
  z-index:9999;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.player-title{
  font-size:13px;
  opacity:.85;
  margin-bottom:8px;
}

#song{
  font-weight:bold;
  font-size:14px;
  margin-bottom:10px;
  line-height:1.25;
  word-break:break-word;
}

.controls{
  display:flex;
  gap:8px;
  margin-top:8px;
}

button{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
  background:#222;
  color:white;
  font-weight:bold;
}

button:hover{
  background:#444;
}

.volume{
  margin-top:8px;
}

#status{
  margin-top:8px;
  font-size:12px;
  opacity:.85;
  min-height:16px;
}
</style>
</head>

<body>

<div class="player">
  <div class="player-title">Brandi’s Universe • STARSET Cosmic Player</div>

  <div id="song">Ready</div>

  <audio id="audio" controls preload="metadata" playsinline webkit-playsinline style="width:100%;"></audio>

  <div class="controls">
    <button id="prev">Prev</button>
    <button id="next">Next</button>
  </div>

  <div class="volume">
    Volume
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
  </div>

  <div id="status">Diamond show armed</div>
</div>

<a-scene background="color:#000">
  <a-assets>
    <img id="sky1" src="space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy.jpg">
    <img id="sky2" src="space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy (1).jpg">
  </a-assets>

  <a-sky id="sky" src="#sky1"></a-sky>
  <a-entity light="type:ambient;intensity:1"></a-entity>

  <!-- IF YOU SEE THIS, THE RIGHT FILE IS LOADING -->
  <a-text
    value="COSMIC V2 LIVE"
    position="0 4 -9"
    align="center"
    width="24"
    color="#3dc4ff">
  </a-text>

  <a-text
    value="Diamond show armed"
    position="0 3.15 -9"
    align="center"
    width="15"
    color="#ffffff">
  </a-text>

  <!-- giant obvious center FX -->
  <a-entity id="heroFX" position="0 1.6 -7">
    <a-ring
      id="ringA"
      radius-inner="1.10"
      radius-outer="1.18"
      material="color:#37d6ff; shader:flat; transparent:true; opacity:0.95">
    </a-ring>

    <a-ring
      id="ringB"
      radius-inner="1.45"
      radius-outer="1.52"
      material="color:#ff4fd8; shader:flat; transparent:true; opacity:0.7">
    </a-ring>

    <a-ring
      id="ringC"
      radius-inner="1.85"
      radius-outer="1.92"
      material="color:#ffffff; shader:flat; transparent:true; opacity:0.45">
    </a-ring>

    <a-entity id="sniperScope">
      <a-ring
        radius-inner="0.22"
        radius-outer="0.27"
        material="color:#ffffff; shader:flat; transparent:true; opacity:0.92">
      </a-ring>

      <a-box position="0 0 0" width="0.42" height="0.012" depth="0.01" material="color:#ffffff; shader:flat;"></a-box>
      <a-box position="0 0 0" width="0.012" height="0.42" depth="0.01" material="color:#ffffff; shader:flat;"></a-box>

      <a-sphere radius="0.035" position="0 0 0.01" material="color:#ff4fd8; shader:flat;"></a-sphere>
    </a-entity>
  </a-entity>

  <a-entity id="diamondFX"></a-entity>
  <a-entity id="dustFX"></a-entity>
  <a-entity id="meteorFX"></a-entity>
  <a-entity id="burstFX"></a-entity>

  <a-sphere
    id="pulseShell"
    radius="28"
    position="0 0 0"
    material="shader: flat; color: #ff4fd8; side: back; transparent: true; opacity: 0.0">
  </a-sphere>
</a-scene>

<script>
const BASE="https://pub-180861afe41148b8acd08af4e87da48b.r2.dev/Music/tree/";

const songs=[
"01 STARSET - A BRIEF HISTORY OF THE FUTURE.mp3",
"01 STARSET - praesens.mp3",
"01 STARSET - The Order.mp3",
"01 STARSET - UNVEILING THE ARCHITECTURE.mp3",
"02 STARSET - DEGENERATE.mp3",
"02 STARSET - MANIFEST.mp3",
"02 STARSET - Satellite.mp3",
"02 STARSET - THE BREACH.mp3",
"03 STARSET - ECHO.mp3",
"03 STARSET - Frequency.mp3",
"03 STARSET - OTHERWORLDLY.mp3",
"03 STARSET - SILOS.mp3",
"04 STARSET - Die For You.mp3",
"04 STARSET - ICARUS.mp3",
"04 STARSET - rise of messenger.mp3",
"04 STARSET - WHERE THE SKIES END.mp3",
"05 STARSET - DARK THINGS.mp3",
"05 STARSET - EARTHRISE.mp3",
"05 STARSET - PERFECT MACHINE.mp3",
"05 STARSET - Ricochet.mp3",
"06 STARSET - LEAVING THIS WORLD BEHIND.mp3",
"06 STARSET - SHATTERED DREAMS.mp3",
"06 STARSET - Starlight.mp3",
"06 STARSET - TELEKINETIC.mp3",
"07 STARSET - DEVOLUTION.mp3",
"07 STARSET - Into The Unknown.mp3",
"07 STARSET - STRATOSPHERE.mp3",
"07 STARSET - temple of milton.mp3",
"08 STARSET - ANNIHILATED LOVE.mp3",
"08 STARSET - BRAVE NEW WORLD.mp3",
"08 STARSET - FAULTLINE.mp3",
"08 STARSET - Gravity Of You.mp3",
"09 STARSET - ALCHEMY.mp3",
"09 STARSET - Back To The Earth.mp3",
"09 STARSET - DYSTOPIA.mp3",
"09 STARSET - SOLSTICE.mp3",
"10 STARSET - DISAPPEAR.mp3",
"10 STARSET - HEAD OVER HEELS.mp3",
"10 STARSET - Last To Fall.mp3",
"10 STARSET - TRIALS.mp3",
"11 STARSET - Bringing It Down.mp3",
"11 STARSET - SWAY.mp3",
"11 STARSET - THIS ENDLESS ENDEAVOR.mp3",
"11 STARSET - WAKING UP.mp3",
"12 STARSET - OTHER WORLDS THAN THESE.mp3",
"12 STARSET - SYMBIOTIC.mp3",
"12 STARSET - the antihero's journey.mp3",
"12 STARSET - Unbecoming.mp3",
"13 STARSET - DIVING BELL.mp3",
"13 STARSET - DREAMCATCHER.mp3",
"13 STARSET - Monster.mp3",
"13 STARSET - TOKSIK.mp3",
"14 STARSET - at his altar.mp3",
"14 STARSET - Telepathic.mp3",
"14 STARSET - TUNNELVISION.mp3",
"15 STARSET - AD ASTRA.mp3",
"15 STARSET - Everglow.mp3",
"15 STARSET - INFECTED.mp3",
"16 STARSET - requiem of the order.mp3",
"16 STARSET - SOMETHING WICKED.mp3"
];

const audio=document.getElementById("audio");
const song=document.getElementById("song");
const statusText=document.getElementById("status");

let index=0;

function url(name){
  return BASE + name.replaceAll(" ","%20");
}

function load(n){
  index=(n+songs.length)%songs.length;
  audio.src=url(songs[index]);
  song.innerText=songs[index];
  statusText.innerText=`Loaded ${index+1} of ${songs.length}`;
  triggerSongBurst();
}

document.getElementById("next").onclick=()=>{
  load(index+1);
  audio.play();
};

document.getElementById("prev").onclick=()=>{
  load(index-1);
  audio.play();
};

document.getElementById("volume").oninput=(e)=>{
  audio.volume=e.target.value;
};

audio.addEventListener("ended",()=>{
  load(index+1);
  audio.play();
});

audio.addEventListener("play",()=>{
  statusText.innerText=`Playing ${index+1} of ${songs.length}`;
});

audio.addEventListener("pause",()=>{
  if(!audio.ended) statusText.innerText="Paused";
});

audio.addEventListener("error",()=>{
  statusText.innerText="Track failed to load";
});

audio.volume=.8;
load(0);

/* background swap */
const sky=document.getElementById("sky");
let toggle=true;

setInterval(()=>{
  sky.setAttribute("src",toggle?"#sky2":"#sky1");
  toggle=!toggle;
},45000);

/* BRIGHT DIAMOND SHOW */
const diamondFX=document.getElementById("diamondFX");
const dustFX=document.getElementById("dustFX");
const meteorFX=document.getElementById("meteorFX");
const burstFX=document.getElementById("burstFX");
const pulseShell=document.getElementById("pulseShell");
const ringA=document.getElementById("ringA");
const ringB=document.getElementById("ringB");
const ringC=document.getElementById("ringC");
const sniperScope=document.getElementById("sniperScope");

const diamonds=[];
const dust=[];

function makeDiamond(){
  const d=document.createElement("a-octahedron");
  const x=(Math.random()*20)-10;
  const y=(Math.random()*10)-5;
  const z=-4-(Math.random()*12);
  const r=0.12+Math.random()*0.18;
  const colors=["#ffffff","#37d6ff","#ff4fd8","#9bf8ff"];
  const color=colors[Math.floor(Math.random()*colors.length)];

  d.setAttribute("radius",r.toFixed(2));
  d.setAttribute("position",`${x} ${y} ${z}`);
  d.setAttribute("material",`shader: flat; color: ${color}; transparent: true; opacity: 0.9`);

  diamondFX.appendChild(d);

  diamonds.push({
    el:d,
    x,y,z,
    rx:Math.random()*360,
    ry:Math.random()*360,
    vx:(Math.random()-0.5)*0.015,
    vy:(Math.random()-0.5)*0.015
  });
}

function makeDust(){
  const p=document.createElement("a-sphere");
  const x=(Math.random()*20)-10;
  const y=(Math.random()*10)-5;
  const z=-3-(Math.random()*10);
  const r=0.03+Math.random()*0.05;

  p.setAttribute("radius",r.toFixed(3));
  p.setAttribute("position",`${x} ${y} ${z}`);
  p.setAttribute("material","shader: flat; color: #7ad7ff; transparent: true; opacity: 0.18");

  dustFX.appendChild(p);

  dust.push({
    el:p,
    x,y,z,
    vx:(Math.random()-0.5)*0.006,
    vy:(Math.random()-0.5)*0.006
  });
}

for(let i=0;i<36;i++) makeDiamond();
for(let i=0;i<70;i++) makeDust();

function makeMeteor(color="#ff4fd8"){
  const meteor=document.createElement("a-cylinder");
  let x=(Math.random()*16)-8;
  let y=7+Math.random()*4;
  let z=-8-Math.random()*6;
  let opacity=0.98;

  meteor.setAttribute("radius","0.05");
  meteor.setAttribute("height","3");
  meteor.setAttribute("rotation","45 0 0");
  meteor.setAttribute("position",`${x} ${y} ${z}`);
  meteor.setAttribute("material",`shader: flat; color: ${color}; transparent: true; opacity: 0.98`);

  meteorFX.appendChild(meteor);

  function animateMeteor(){
    x+=0.24;
    y-=0.24;
    opacity-=0.035;

    meteor.setAttribute("position",`${x} ${y} ${z}`);
    meteor.setAttribute("material",`shader: flat; color: ${color}; transparent: true; opacity: ${Math.max(opacity,0)}`);

    if(opacity>0){
      requestAnimationFrame(animateMeteor);
    }else{
      meteor.remove();
    }
  }

  requestAnimationFrame(animateMeteor);
}

function triggerSongBurst(){
  for(let i=0;i<14;i++){
    const burst=document.createElement("a-sphere");
    const x=(Math.random()*14)-7;
    const y=(Math.random()*8)-4;
    const z=-4-(Math.random()*8);

    burst.setAttribute("radius","0.14");
    burst.setAttribute("position",`${x} ${y} ${z}`);
    burst.setAttribute("material","shader: flat; color: #ff4fd8; transparent: true; opacity: 0.7");

    burstFX.appendChild(burst);

    let scale=0.25;
    let opacity=0.7;

    function animateBurst(){
      scale+=0.12;
      opacity-=0.03;
      burst.setAttribute("scale",`${scale} ${scale} ${scale}`);
      burst.setAttribute("material",`shader: flat; color: #ff4fd8; transparent: true; opacity: ${Math.max(opacity,0)}`);

      if(opacity>0){
        requestAnimationFrame(animateBurst);
      }else{
        burst.remove();
      }
    }

    requestAnimationFrame(animateBurst);
  }
}

let t=0;

function animateCosmos(){
  const playing=!audio.paused && !audio.ended && !!audio.src;
  const speed=playing?1.4:0.45;

  diamonds.forEach((d)=>{
    d.x+=d.vx*speed;
    d.y+=d.vy*speed;
    d.rx+=1.4*speed;
    d.ry+=1.9*speed;

    if(d.x<-11) d.x=11;
    if(d.x>11) d.x=-11;
    if(d.y<-6) d.y=6;
    if(d.y>6) d.y=-6;

    d.el.setAttribute("position",`${d.x} ${d.y} ${d.z}`);
    d.el.setAttribute("rotation",`${d.rx} ${d.ry} 0`);
  });

  dust.forEach((p)=>{
    p.x+=p.vx*speed;
    p.y+=p.vy*speed;

    if(p.x<-11) p.x=11;
    if(p.x>11) p.x=-11;
    if(p.y<-6) p.y=6;
    if(p.y>6) p.y=-6;

    p.el.setAttribute("position",`${p.x} ${p.y} ${p.z}`);
  });

  ringA.setAttribute("rotation",`0 0 ${t*1.5}`);
  ringB.setAttribute("rotation",`0 0 ${-t*1.1}`);
  ringC.setAttribute("rotation",`0 0 ${t*0.7}`);
  sniperScope.setAttribute("rotation",`0 0 ${t*0.25}`);

  if(playing){
    const pulse=(Math.sin(t*0.12)*0.5+0.5)*0.24;
    pulseShell.setAttribute(
      "material",
      `shader: flat; color: #ff4fd8; side: back; transparent: true; opacity: ${pulse.toFixed(3)}`
    );

    if(Math.random()<0.03){
      makeMeteor(Math.random()>0.5 ? "#ff4fd8" : "#37d6ff");
    }
  }else{
    const idlePulse=(Math.sin(t*0.06)*0.5+0.5)*0.06;
    pulseShell.setAttribute(
      "material",
      `shader: flat; color: #37d6ff; side: back; transparent: true; opacity: ${idlePulse.toFixed(3)}`
    );

    if(Math.random()<0.008){
      makeMeteor("#ffffff");
    }
  }

  t+=1;
  requestAnimationFrame(animateCosmos);
}

animateCosmos();
</script>

</body>
</html>
