<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brandi's Universe — Cosmic v2</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
html,body{
  margin:0;
  height:100%;
  background:black;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
}

.player{
  position:fixed;
  right:12px;
  bottom:12px;
  width:340px;
  background:rgba(0,0,0,.62);
  padding:14px;
  border-radius:12px;
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.15);
  z-index:9999;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.player-title{
  font-size:13px;
  opacity:.85;
  margin-bottom:8px;
}

#song{
  font-weight:bold;
  font-size:14px;
  margin-bottom:10px;
  line-height:1.25;
  word-break:break-word;
}

.controls{
  display:flex;
  gap:8px;
  margin-top:8px;
}

button{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
  background:#222;
  color:white;
  font-weight:bold;
}

button:hover{
  background:#444;
}

.volume{
  margin-top:8px;
}

#status{
  margin-top:8px;
  font-size:12px;
  opacity:.85;
  min-height:16px;
}
</style>
</head>

<body>

<div class="player">
  <div class="player-title">Brandi’s Universe • STARSET Cosmic Player</div>

  <div id="song">Ready</div>

  <audio id="audio" controls preload="metadata" playsinline webkit-playsinline style="width:100%;"></audio>

  <div class="controls">
    <button id="prev">Prev</button>
    <button id="next">Next</button>
  </div>

  <div class="volume">
    Volume
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
  </div>

  <div id="status">Cosmic show armed</div>
</div>

<a-scene background="color:#000">
  <a-assets>
    <img id="sky1" src="space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy.jpg">
    <img id="sky2" src="space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy (1).jpg">
  </a-assets>

  <a-sky id="sky" src="#sky1"></a-sky>
  <a-entity light="type:ambient;intensity:1"></a-entity>

  <!-- background fx only -->
  <a-entity id="starfieldFar"></a-entity>
  <a-entity id="starfieldMid"></a-entity>
  <a-entity id="dustFX"></a-entity>
  <a-entity id="meteorFX"></a-entity>
  <a-entity id="burstFX"></a-entity>

  <a-sphere
    id="pulseShell"
    radius="34"
    position="0 0 0"
    material="shader: flat; color: #ff4fd8; side: back; transparent: true; opacity: 0.0">
  </a-sphere>
</a-scene>

<script>
const BASE="https://pub-180861afe41148b8acd08af4e87da48b.r2.dev/Music/tree/";

const songs=[
"01 STARSET - A BRIEF HISTORY OF THE FUTURE.mp3",
"01 STARSET - praesens.mp3",
"01 STARSET - The Order.mp3",
"01 STARSET - UNVEILING THE ARCHITECTURE.mp3",
"02 STARSET - DEGENERATE.mp3",
"02 STARSET - MANIFEST.mp3",
"02 STARSET - Satellite.mp3",
"02 STARSET - THE BREACH.mp3",
"03 STARSET - ECHO.mp3",
"03 STARSET - Frequency.mp3",
"03 STARSET - OTHERWORLDLY.mp3",
"03 STARSET - SILOS.mp3",
"04 STARSET - Die For You.mp3",
"04 STARSET - ICARUS.mp3",
"04 STARSET - rise of messenger.mp3",
"04 STARSET - WHERE THE SKIES END.mp3",
"05 STARSET - DARK THINGS.mp3",
"05 STARSET - EARTHRISE.mp3",
"05 STARSET - PERFECT MACHINE.mp3",
"05 STARSET - Ricochet.mp3",
"06 STARSET - LEAVING THIS WORLD BEHIND.mp3",
"06 STARSET - SHATTERED DREAMS.mp3",
"06 STARSET - Starlight.mp3",
"06 STARSET - TELEKINETIC.mp3",
"07 STARSET - DEVOLUTION.mp3",
"07 STARSET - Into The Unknown.mp3",
"07 STARSET - STRATOSPHERE.mp3",
"07 STARSET - temple of milton.mp3",
"08 STARSET - ANNIHILATED LOVE.mp3",
"08 STARSET - BRAVE NEW WORLD.mp3",
"08 STARSET - FAULTLINE.mp3",
"08 STARSET - Gravity Of You.mp3",
"09 STARSET - ALCHEMY.mp3",
"09 STARSET - Back To The Earth.mp3",
"09 STARSET - DYSTOPIA.mp3",
"09 STARSET - SOLSTICE.mp3",
"10 STARSET - DISAPPEAR.mp3",
"10 STARSET - HEAD OVER HEELS.mp3",
"10 STARSET - Last To Fall.mp3",
"10 STARSET - TRIALS.mp3",
"11 STARSET - Bringing It Down.mp3",
"11 STARSET - SWAY.mp3",
"11 STARSET - THIS ENDLESS ENDEAVOR.mp3",
"11 STARSET - WAKING UP.mp3",
"12 STARSET - OTHER WORLDS THAN THESE.mp3",
"12 STARSET - SYMBIOTIC.mp3",
"12 STARSET - the antihero's journey.mp3",
"12 STARSET - Unbecoming.mp3",
"13 STARSET - DIVING BELL.mp3",
"13 STARSET - DREAMCATCHER.mp3",
"13 STARSET - Monster.mp3",
"13 STARSET - TOKSIK.mp3",
"14 STARSET - at his altar.mp3",
"14 STARSET - Telepathic.mp3",
"14 STARSET - TUNNELVISION.mp3",
"15 STARSET - AD ASTRA.mp3",
"15 STARSET - Everglow.mp3",
"15 STARSET - INFECTED.mp3",
"16 STARSET - requiem of the order.mp3",
"16 STARSET - SOMETHING WICKED.mp3"
];

const audio=document.getElementById("audio");
const song=document.getElementById("song");
const statusText=document.getElementById("status");

let index=0;

function url(name){
  return BASE + name.replaceAll(" ","%20");
}

function load(n){
  index=(n+songs.length)%songs.length;
  audio.src=url(songs[index]);
  song.innerText=songs[index];
  statusText.innerText=`Loaded ${index+1} of ${songs.length}`;
  triggerSongBurst();
}

document.getElementById("next").onclick=()=>{
  load(index+1);
  audio.play();
};

document.getElementById("prev").onclick=()=>{
  load(index-1);
  audio.play();
};

document.getElementById("volume").oninput=(e)=>{
  audio.volume=e.target.value;
};

audio.addEventListener("ended",()=>{
  load(index+1);
  audio.play();
});

audio.addEventListener("play",()=>{
  statusText.innerText=`Playing ${index+1} of ${songs.length}`;
});

audio.addEventListener("pause",()=>{
  if(!audio.ended) statusText.innerText="Paused";
});

audio.addEventListener("error",()=>{
  statusText.innerText="Track failed to load";
});

audio.volume=.8;
load(0);

/* background swap */
const sky=document.getElementById("sky");
let toggle=true;
setInterval(()=>{
  sky.setAttribute("src",toggle?"#sky2":"#sky1");
  toggle=!toggle;
},45000);

/* --------- MAGIC SHOW --------- */
const starfieldFar=document.getElementById("starfieldFar");
const starfieldMid=document.getElementById("starfieldMid");
const dustFX=document.getElementById("dustFX");
const meteorFX=document.getElementById("meteorFX");
const burstFX=document.getElementById("burstFX");
const pulseShell=document.getElementById("pulseShell");

const farStars=[];
const midStars=[];
const dust=[];

function makeFarStar(){
  const s=document.createElement("a-sphere");
  const x=(Math.random()*120)-60;
  const y=(Math.random()*60)-30;
  const z=(Math.random()*120)-60;
  const r=0.035+Math.random()*0.05;
  s.setAttribute("radius",r.toFixed(3));
  s.setAttribute("position",`${x} ${y} ${z}`);
  s.setAttribute("material","shader: flat; color: #ffffff; transparent: true; opacity: 0.85");
  starfieldFar.appendChild(s);

  farStars.push({
    el:s,x,y,z,
    vx:(Math.random()-0.5)*0.003,
    vy:(Math.random()-0.5)*0.003
  });
}

function makeMidStar(){
  const s=document.createElement("a-sphere");
  const x=(Math.random()*40)-20;
  const y=(Math.random()*24)-12;
  const z=-8-(Math.random()*18);
  const r=0.05+Math.random()*0.09;
  const colors=["#ffffff","#9fe8ff","#ff7de8"];
  const color=colors[Math.floor(Math.random()*colors.length)];
  s.setAttribute("radius",r.toFixed(3));
  s.setAttribute("position",`${x} ${y} ${z}`);
  s.setAttribute("material",`shader: flat; color: ${color}; transparent: true; opacity: 0.92`);
  starfieldMid.appendChild(s);

  midStars.push({
    el:s,x,y,z,
    vx:(Math.random()-0.5)*0.009,
    vy:(Math.random()-0.5)*0.009
  });
}

function makeDust(){
  const p=document.createElement("a-sphere");
  const x=(Math.random()*34)-17;
  const y=(Math.random()*18)-9;
  const z=-6-(Math.random()*14);
  const r=0.06+Math.random()*0.08;
  p.setAttribute("radius",r.toFixed(3));
  p.setAttribute("position",`${x} ${y} ${z}`);
  p.setAttribute("material","shader: flat; color: #7ad7ff; transparent: true; opacity: 0.15");
  dustFX.appendChild(p);

  dust.push({
    el:p,x,y,z,
    vx:(Math.random()-0.5)*0.005,
    vy:(Math.random()-0.5)*0.005
  });
}

function makeMeteor(color="#ff4fd8"){
  const meteor=document.createElement("a-cylinder");
  let x=(Math.random()*26)-13;
  let y=10+Math.random()*6;
  let z=-10-(Math.random()*12);
  let opacity=0.98;

  meteor.setAttribute("radius","0.045");
  meteor.setAttribute("height","2.8");
  meteor.setAttribute("rotation","45 0 0");
  meteor.setAttribute("position",`${x} ${y} ${z}`);
  meteor.setAttribute("material",`shader: flat; color: ${color}; transparent: true; opacity: 0.98`);
  meteorFX.appendChild(meteor);

  function animateMeteor(){
    x+=0.28;
    y-=0.22;
    opacity-=0.03;
    meteor.setAttribute("position",`${x} ${y} ${z}`);
    meteor.setAttribute("material",`shader: flat; color: ${color}; transparent: true; opacity: ${Math.max(opacity,0)}`);
    if(opacity>0){
      requestAnimationFrame(animateMeteor);
    }else{
      meteor.remove();
    }
  }

  requestAnimationFrame(animateMeteor);
}

function triggerSongBurst(){
  for(let i=0;i<12;i++){
    const burst=document.createElement("a-sphere");
    const x=(Math.random()*26)-13;
    const y=(Math.random()*14)-7;
    const z=-7-(Math.random()*10);
    const color=Math.random()>0.5 ? "#ff4fd8" : "#37d6ff";

    burst.setAttribute("radius","0.12");
    burst.setAttribute("position",`${x} ${y} ${z}`);
    burst.setAttribute("material",`shader: flat; color: ${color}; transparent: true; opacity: 0.65`);
    burstFX.appendChild(burst);

    let scale=0.22;
    let opacity=0.65;

    function anim(){
      scale+=0.12;
      opacity-=0.03;
      burst.setAttribute("scale",`${scale} ${scale} ${scale}`);
      burst.setAttribute("material",`shader: flat; color: ${color}; transparent: true; opacity: ${Math.max(opacity,0)}`);
      if(opacity>0){
        requestAnimationFrame(anim);
      }else{
        burst.remove();
      }
    }
    requestAnimationFrame(anim);
  }
}

/* spawn gradually so mobile doesn't choke */
let farCount=0;
let midCount=0;
let dustCount=0;

const farSpawner=setInterval(()=>{
  makeFarStar();
  farCount++;
  if(farCount>=140) clearInterval(farSpawner);
},35);

const midSpawner=setInterval(()=>{
  makeMidStar();
  midCount++;
  if(midCount>=45) clearInterval(midSpawner);
},80);

const dustSpawner=setInterval(()=>{
  makeDust();
  dustCount++;
  if(dustCount>=38) clearInterval(dustSpawner);
},110);

let t=0;
function animateCosmos(){
  const playing=!audio.paused && !audio.ended && !!audio.src;
  const farSpeed=playing?1.2:0.35;
  const midSpeed=playing?1.7:0.45;
  const dustSpeed=playing?0.9:0.25;

  farStars.forEach((s)=>{
    s.x+=s.vx*farSpeed;
    s.y+=s.vy*farSpeed;
    if(s.x<-62) s.x=62;
    if(s.x>62) s.x=-62;
    if(s.y<-32) s.y=32;
    if(s.y>32) s.y=-32;
    s.el.setAttribute("position",`${s.x} ${s.y} ${s.z}`);
  });

  midStars.forEach((s)=>{
    s.x+=s.vx*midSpeed;
    s.y+=s.vy*midSpeed;
    if(s.x<-22) s.x=22;
    if(s.x>22) s.x=-22;
    if(s.y<-13) s.y=13;
    if(s.y>13) s.y=-13;
    s.el.setAttribute("position",`${s.x} ${s.y} ${s.z}`);
  });

  dust.forEach((p)=>{
    p.x+=p.vx*dustSpeed;
    p.y+=p.vy*dustSpeed;
    if(p.x<-18) p.x=18;
    if(p.x>18) p.x=-18;
    if(p.y<-10) p.y=10;
    if(p.y>10) p.y=-10;
    p.el.setAttribute("position",`${p.x} ${p.y} ${p.z}`);
  });

  if(playing){
    const pulse=(Math.sin(t*0.09)*0.5+0.5)*0.18;
    pulseShell.setAttribute(
      "material",
      `shader: flat; color: #ff4fd8; side: back; transparent: true; opacity: ${pulse.toFixed(3)}`
    );
    if(Math.random()<0.03){
      makeMeteor(Math.random()>0.5 ? "#ff4fd8" : "#37d6ff");
    }
  }else{
    const idle=(Math.sin(t*0.05)*0.5+0.5)*0.05;
    pulseShell.setAttribute(
      "material",
      `shader: flat; color: #37d6ff; side: back; transparent: true; opacity: ${idle.toFixed(3)}`
    );
    if(Math.random()<0.008){
      makeMeteor("#ffffff");
    }
  }

  t+=1;
  requestAnimationFrame(animateCosmos);
}

animateCosmos();
</script>

</body>
</html>
