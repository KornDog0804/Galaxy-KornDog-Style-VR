<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brandi's Universe — STARSET VR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .player {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 340px;
      background: rgba(0,0,0,.62);
      padding: 14px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.15);
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .player-title {
      font-size: 13px;
      opacity: .85;
      margin-bottom: 8px;
    }

    #song {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 10px;
      line-height: 1.25;
      word-break: break-word;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #222;
      color: #fff;
      font-weight: bold;
    }

    .volume {
      margin-top: 8px;
    }

    #status {
      margin-top: 8px;
      font-size: 12px;
      opacity: .85;
      min-height: 16px;
    }

    audio {
      width: 100%;
    }
  </style>
</head>
<body>

<div class="player">
  <div class="player-title">Brandi’s Universe • STARSET Cosmic Player</div>
  <div id="song">Ready</div>

  <audio id="audio" controls preload="metadata" playsinline webkit-playsinline></audio>

  <div class="controls">
    <button id="prev">Prev</button>
    <button id="next">Next</button>
  </div>

  <div class="volume">
    Volume
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
  </div>

  <div id="status">Universe online</div>
</div>

<a-scene background="color:#000">
  <a-assets>
    <!-- 4 full worlds -->
    <img id="sky1" src="./blue_nebulae_1.png">
    <img id="sky2" src="./hazy_nebulae_1.png">
    <img id="sky3" src="./plain_starfield_1.png">
    <img id="sky4" src="./ringed_gas_giant_planet.png">

    <!-- safe extras -->
    <img id="nebula1" src="./nebula-overlay-1.jpg">
    <img id="starsOverlay" src="./starfield-overlay.png">
    <img id="meteorStreak" src="./meteor-streak.png">
  </a-assets>

  <a-entity light="type: ambient; intensity: 1.0"></a-entity>

  <!-- normal VR head look, no cursor junk -->
  <a-entity id="cameraRig" position="0 1.6 0">
    <a-camera look-controls="pointerLockEnabled: false"></a-camera>
  </a-entity>

  <a-entity id="universeRig">
    <!-- main 360 world -->
    <a-sky id="sky" src="#sky1" rotation="0 -90 0"></a-sky>

    <!-- far star shimmer -->
    <a-plane
      id="starsFar"
      src="#starsOverlay"
      position="0 14 -90"
      width="210"
      height="120"
      material="shader: flat; transparent: true; opacity: 0.18; alphaTest: 0.02">
    </a-plane>

    <a-plane
      id="starsLeft"
      src="#starsOverlay"
      position="-85 20 -80"
      rotation="0 34 0"
      width="120"
      height="72"
      material="shader: flat; transparent: true; opacity: 0.12; alphaTest: 0.02">
    </a-plane>

    <a-plane
      id="starsRight"
      src="#starsOverlay"
      position="85 10 -80"
      rotation="0 -34 0"
      width="120"
      height="72"
      material="shader: flat; transparent: true; opacity: 0.12; alphaTest: 0.02">
    </a-plane>

    <!-- one main nebula only, pushed back -->
    <a-plane
      id="heroNebula"
      src="#nebula1"
      position="-55 24 -140"
      rotation="0 20 0"
      width="70"
      height="70"
      material="shader: flat; transparent: true; opacity: 0.88">
    </a-plane>

    <!-- meteor shower pool -->
    <a-plane
      id="meteor1"
      src="#meteorStreak"
      position="-60 34 -70"
      width="12"
      height="5"
      visible="false"
      material="shader: flat; transparent: true; opacity: 0.0; alphaTest: 0.02; blending: additive">
    </a-plane>

    <a-plane
      id="meteor2"
      src="#meteorStreak"
      position="-60 34 -70"
      width="14"
      height="5.5"
      visible="false"
      material="shader: flat; transparent: true; opacity: 0.0; alphaTest: 0.02; blending: additive">
    </a-plane>

    <a-plane
      id="meteor3"
      src="#meteorStreak"
      position="-60 34 -70"
      width="10"
      height="4.2"
      visible="false"
      material="shader: flat; transparent: true; opacity: 0.0; alphaTest: 0.02; blending: additive">
    </a-plane>

    <a-plane
      id="meteor4"
      src="#meteorStreak"
      position="-60 34 -70"
      width="13"
      height="5.2"
      visible="false"
      material="shader: flat; transparent: true; opacity: 0.0; alphaTest: 0.02; blending: additive">
    </a-plane>

    <a-plane
      id="meteor5"
      src="#meteorStreak"
      position="-60 34 -70"
      width="11"
      height="4.8"
      visible="false"
      material="shader: flat; transparent: true; opacity: 0.0; alphaTest: 0.02; blending: additive">
    </a-plane>
  </a-entity>
</a-scene>

<script>
/* --------------------------
   MUSIC / PLAYER
--------------------------- */
const BASE = "https://pub-180861afe41148b8acd08af4e87da48b.r2.dev/Music/tree/";

const songs = [
  "01 STARSET - A BRIEF HISTORY OF THE FUTURE.mp3",
  "01 STARSET - praesens.mp3",
  "01 STARSET - The Order.mp3",
  "01 STARSET - UNVEILING THE ARCHITECTURE.mp3",
  "02 STARSET - DEGENERATE.mp3",
  "02 STARSET - MANIFEST.mp3",
  "02 STARSET - Satellite.mp3",
  "02 STARSET - THE BREACH.mp3",
  "03 STARSET - ECHO.mp3",
  "03 STARSET - Frequency.mp3",
  "03 STARSET - OTHERWORLDLY.mp3",
  "03 STARSET - SILOS.mp3",
  "04 STARSET - Die For You.mp3",
  "04 STARSET - ICARUS.mp3",
  "04 STARSET - rise of messenger.mp3",
  "04 STARSET - WHERE THE SKIES END.mp3",
  "05 STARSET - DARK THINGS.mp3",
  "05 STARSET - EARTHRISE.mp3",
  "05 STARSET - PERFECT MACHINE.mp3",
  "05 STARSET - Ricochet.mp3",
  "06 STARSET - LEAVING THIS WORLD BEHIND.mp3",
  "06 STARSET - SHATTERED DREAMS.mp3",
  "06 STARSET - Starlight.mp3",
  "06 STARSET - TELEKINETIC.mp3",
  "07 STARSET - DEVOLUTION.mp3",
  "07 STARSET - Into The Unknown.mp3",
  "07 STARSET - STRATOSPHERE.mp3",
  "07 STARSET - temple of milton.mp3",
  "08 STARSET - ANNIHILATED LOVE.mp3",
  "08 STARSET - BRAVE NEW WORLD.mp3",
  "08 STARSET - FAULTLINE.mp3",
  "08 STARSET - Gravity Of You.mp3",
  "09 STARSET - ALCHEMY.mp3",
  "09 STARSET - Back To The Earth.mp3",
  "09 STARSET - DYSTOPIA.mp3",
  "09 STARSET - SOLSTICE.mp3",
  "10 STARSET - DISAPPEAR.mp3",
  "10 STARSET - HEAD OVER HEELS.mp3",
  "10 STARSET - Last To Fall.mp3",
  "10 STARSET - TRIALS.mp3",
  "11 STARSET - Bringing It Down.mp3",
  "11 STARSET - SWAY.mp3",
  "11 STARSET - THIS ENDLESS ENDEAVOR.mp3",
  "11 STARSET - WAKING UP.mp3",
  "12 STARSET - OTHER WORLDS THAN THESE.mp3",
  "12 STARSET - SYMBIOTIC.mp3",
  "12 STARSET - the antihero's journey.mp3",
  "12 STARSET - Unbecoming.mp3",
  "13 STARSET - DIVING BELL.mp3",
  "13 STARSET - DREAMCATCHER.mp3",
  "13 STARSET - Monster.mp3",
  "13 STARSET - TOKSIK.mp3",
  "14 STARSET - at his altar.mp3",
  "14 STARSET - Telepathic.mp3",
  "14 STARSET - TUNNELVISION.mp3",
  "15 STARSET - AD ASTRA.mp3",
  "15 STARSET - Everglow.mp3",
  "15 STARSET - INFECTED.mp3",
  "16 STARSET - requiem of the order.mp3",
  "16 STARSET - SOMETHING WICKED.mp3"
];

const audio = document.getElementById("audio");
const song = document.getElementById("song");
const statusText = document.getElementById("status");
const volumeSlider = document.getElementById("volume");

let shuffledSongs = [];
let index = 0;

function url(name) {
  return BASE + name.replaceAll(" ", "%20");
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function rebuildShuffle(keepCurrent = null) {
  shuffledSongs = shuffleArray(songs);

  if (keepCurrent && shuffledSongs.length > 1 && shuffledSongs[0] === keepCurrent) {
    const swapIndex = 1 + Math.floor(Math.random() * (shuffledSongs.length - 1));
    [shuffledSongs[0], shuffledSongs[swapIndex]] = [shuffledSongs[swapIndex], shuffledSongs[0]];
  }

  index = 0;
}

function currentSongName() {
  return shuffledSongs[index];
}

function load(n) {
  if (!shuffledSongs.length) rebuildShuffle();

  if (n < 0) n = shuffledSongs.length - 1;

  if (n >= shuffledSongs.length) {
    const lastSong = shuffledSongs[shuffledSongs.length - 1];
    rebuildShuffle(lastSong);
    n = 0;
  }

  index = n;
  const track = currentSongName();
  audio.src = url(track);
  song.innerText = track;
  statusText.innerText = `Loaded ${index + 1} of ${shuffledSongs.length} • Shuffled`;
}

document.getElementById("next").onclick = () => {
  load(index + 1);
  audio.play();
};

document.getElementById("prev").onclick = () => {
  load(index - 1);
  audio.play();
};

volumeSlider.oninput = (e) => {
  audio.volume = e.target.value;
};

audio.addEventListener("ended", () => {
  load(index + 1);
  audio.play();
});

audio.addEventListener("play", () => {
  statusText.innerText = `Playing ${index + 1} of ${shuffledSongs.length} • Shuffled`;
});

audio.addEventListener("pause", () => {
  if (!audio.ended) statusText.innerText = "Paused";
});

audio.addEventListener("error", () => {
  statusText.innerText = "Track failed to load";
});

audio.volume = 0.8;
rebuildShuffle();
load(0);

/* --------------------------
   SKY CYCLE
--------------------------- */
const sky = document.getElementById("sky");
const skyCycle = ["#sky1", "#sky2", "#sky3", "#sky4"];
let skyIndex = 0;

setInterval(() => {
  skyIndex = (skyIndex + 1) % skyCycle.length;
  sky.setAttribute("src", skyCycle[skyIndex]);
}, 60000);

/* --------------------------
   WORLD MOTION
--------------------------- */
const universeRig = document.getElementById("universeRig");
const starsFar = document.getElementById("starsFar");
const starsLeft = document.getElementById("starsLeft");
const starsRight = document.getElementById("starsRight");
const heroNebula = document.getElementById("heroNebula");

let skyYaw = -90;
let skyPitch = 0;
let skyRoll = 0;
let phase = 0;

function animateUniverse() {
  const playing = !audio.paused && !audio.ended && !!audio.src;

  phase += playing ? 0.016 : 0.007;

  /* actual noticeable spin + roll so you can see the whole world */
  skyYaw += playing ? 0.045 : 0.020;
  skyPitch = Math.sin(phase * 0.16) * 6.5;
  skyRoll = Math.cos(phase * 0.12) * 10.5;

  sky.setAttribute("rotation", `${skyPitch.toFixed(2)} ${skyYaw.toFixed(2)} ${skyRoll.toFixed(2)}`);

  /* subtle stars alive in the distance */
  const starBase = playing ? 0.18 + (Math.sin(phase * 1.8) * 0.03) : 0.12;
  starsFar.setAttribute("material", `shader: flat; transparent: true; opacity: ${starBase.toFixed(3)}; alphaTest: 0.02`);
  starsLeft.setAttribute("material", `shader: flat; transparent: true; opacity: ${(starBase * 0.7).toFixed(3)}; alphaTest: 0.02`);
  starsRight.setAttribute("material", `shader: flat; transparent: true; opacity: ${(starBase * 0.7).toFixed(3)}; alphaTest: 0.02`);

  /* hero nebula breathing very lightly in the distance */
  const nebulaScale = 1 + Math.sin(phase * 0.18) * 0.035;
  const nebulaX = -55 + Math.cos(phase * 0.10) * 5;
  const nebulaY = 24 + Math.sin(phase * 0.12) * 2.5;

  heroNebula.setAttribute("scale", `${nebulaScale.toFixed(3)} ${nebulaScale.toFixed(3)} 1`);
  heroNebula.setAttribute("position", `${nebulaX.toFixed(2)} ${nebulaY.toFixed(2)} -140`);

  requestAnimationFrame(animateUniverse);
}

animateUniverse();

/* --------------------------
   METEOR SHOWERS
--------------------------- */
const meteors = [
  document.getElementById("meteor1"),
  document.getElementById("meteor2"),
  document.getElementById("meteor3"),
  document.getElementById("meteor4"),
  document.getElementById("meteor5")
];

function launchMeteor(el, delay = 0) {
  setTimeout(() => {
    let x = -90 - Math.random() * 30;
    let y = 35 + Math.random() * 20;
    let z = -85 - Math.random() * 35;
    let opacity = 0.95;
    const angle = -10 - Math.random() * 20;
    const speedX = 1.2 + Math.random() * 0.6;
    const speedY = 0.45 + Math.random() * 0.25;

    el.setAttribute("visible", true);
    el.setAttribute("position", `${x} ${y} ${z}`);
    el.setAttribute("rotation", `0 0 ${angle}`);
    el.setAttribute(
      "material",
      `shader: flat; transparent: true; opacity: ${opacity}; alphaTest: 0.02; blending: additive`
    );

    function anim() {
      x += speedX;
      y -= speedY;
      opacity -= 0.014;

      el.setAttribute("position", `${x} ${y} ${z}`);
      el.setAttribute(
        "material",
        `shader: flat; transparent: true; opacity: ${Math.max(opacity, 0)}; alphaTest: 0.02; blending: additive`
      );

      if (opacity > 0) {
        requestAnimationFrame(anim);
      } else {
        el.setAttribute("visible", false);
      }
    }

    requestAnimationFrame(anim);
  }, delay);
}

function meteorShower() {
  launchMeteor(meteors[0], 0);
  launchMeteor(meteors[1], 400);
  launchMeteor(meteors[2], 900);
  launchMeteor(meteors[3], 1500);
  launchMeteor(meteors[4], 2300);
}

setInterval(() => {
  meteorShower();
}, 8500);
</script>

</body>
</html>
